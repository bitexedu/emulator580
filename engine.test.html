      en.setCalcMode('equation');
      en.setEquationType('poly3');
      coefficients.forEach((c) => {
        if (c < 0) { en.inputNegative(); }
        String(Math.abs(c)).split('').forEach((d) => en.inputDigit(d));
        en.equals();
      });
      en.equals();
      return en;
    }

    function statTypeValue(en, value) {
      String(value).split('').forEach((ch) => {
        if (ch === '.') en.inputDot();
        else if (ch === '-') en.inputNegative();
        else en.inputDigit(ch);
      });
      en.equals();

    function statFreqEngine(pairs) {
      const en = createEngine();
      en.setCalcMode('statistics');
      en.setStatisticsFrequency(true);
      en.setStatisticsType('1var');
      pairs.forEach((pair) => statTypeValue(en, pair[0]));
      pairs.forEach(() => en.moveCursor('up'));
      en.moveCursor('right');
      pairs.forEach((pair) => statTypeValue(en, pair[1]));
      return en;
    }

    // ===== Mode Statistics — hai biến kèm Frequency =====

    // Nhập từng cột: hết cột x, về dòng 1 sang cột kế, hết cột đó — như trên máy.
    function twoVarFreqEngine(pairs) {
      const en = createEngine();
      en.setCalcMode('statistics');
      en.setStatisticsFrequency(true);
      en.setStatisticsType('linear');
      const gotoColTop = (idx) => {
        pairs.forEach(() => en.moveCursor('up'));
        en.moveCursor('left'); en.moveCursor('left');
        for (let k = 0; k < idx; k++) en.moveCursor('right');
      };
      pairs.forEach((p) => statTypeValue(en, p[0]));
      gotoColTop(1); pairs.forEach((p) => statTypeValue(en, p[1]));
      gotoColTop(2); pairs.forEach((p) => statTypeValue(en, p[2]));
      return en;
    }

    // Freq On thêm cột thứ ba Freq cho kiểu hai biến.

    check('[ĐÃ XÁC NHẬN 2026-08-31] 1+2and4 = 0 (and < +)', evaluateBaseN('1+2and4', 'dec'), 0n);

    // ===== Mode Base-N — tích hợp qua engine =====
    function baseNEngine() {
      const en = createEngine();
      en.setCalcMode('base-n');
      return en;
    }
    // Nhập một dãy ký tự (chữ số hoặc A-F) và toán tử vào engine base-n.
    function baseNType(en, s) {
      for (const ch of s) {
        if ('0123456789'.indexOf(ch) >= 0) en.inputDigit(ch);
        else if ('ABCDEF'.indexOf(ch) >= 0) en.inputBaseNLetter(ch);
        else if (ch === '+') en.inputOperator('+');
        else if (ch === '-') en.inputOperator('-');
        else if (ch === '×') en.inputOperator('×');
        else if (ch === '÷') en.inputOperator('÷');
      }
    }

    // CASIO 2026-10-06: gọi lại nghiệm chốt bằng biến/Ans có dạng hữu tỉ.

    const solveMemoryFraction=state=>state.exactFraction?

    function solveMemoryPower(degree,cut,start) {

    for(const [exponent,expected,fraction] of [[6,'0','-'],[12,'0.23','23/100']]) {

    // CASIO 2026-10-07: phân số khi gọi nghiệm là dạng hiển thị,

      checkFrac(label + '▲/▼ phần nguyên không đổi ô', nav.getState().exactFraction, {negative:false,num:'247',den:'2'});
      nav = createEngine(); nav.inputMixedNumber(); nav.inputDigit('1'); nav.moveCursor('right');
      typeNumber(nav,'23'); nav.moveCursor('down'); nav.inputDigit('4'); nav.moveCursor('up'); nav.inputDigit('5'); nav.equals();
      checkFrac(label + 'tử/mẫu giữ vị trí 23 → 253', nav.getState().exactFraction, {negative:false,num:'257',den:'4'});
      for (const [method, expected] of [['inputIntegral','-372'], ['inputSum','6'], ['inputProduct','24']]) {
        nav = createEngine(); nav[method]();
        if(method==='inputIntegral'){
          typeNumber(nav,'12');nav.moveCursor('up');nav.inputDigit('4');nav.moveCursor('down');nav.inputDigit('3');
          nav.moveCursor('down');nav.inputDigit('5');
        }else{
          nav.inputXVariable();nav.moveCursor('right');nav.inputDigit('1');nav.moveCursor('up');nav.inputDigit(method==='inputSum'?'3':'4');
        }
        nav.equals();
        check(label + method + ' chuyển cận và giữ ô ở biên', nav.getState().result, expected);
      }
    }

    // [ĐÃ XÁC NHẬN 2026-11-04] F126 và biến thể; CASIO vẫn cho0
    // với |x| tại0 (sai phân đối xứng), dù đạo hàm toán học không tồn tại.
    for (const [polynomial, point, expected] of [[true,'1','Time Out'],[true,'2','Time Out'],[true,'1.5','0'],[false,'0','0']]) {
      const derivative = createEngine();
      derivative.inputDerivative(); derivative.inputFunction('Abs(');
      derivative.inputXVariable();
      if (polynomial) {
        derivative.inputOperator('²'); derivative.inputOperator('-');
        derivative.inputDigit('3'); derivative.inputXVariable(); derivative.inputOperator('+'); derivative.inputDigit('2');
      }
      derivative.moveCursor('right'); derivative.moveCursor('right'); typeNumber(derivative,point); derivative.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-04] đạo hàm '+(polynomial?'|x²−3x+2|':'|x|')+' tại'+point,
        derivative.getState().message || derivative.getState().result, expected);
    }

    // [ĐÃ XÁC NHẬN 2026-11-04] F119: ngăn xếp24 phép đang chờ;
    // chuỗi chưa đủ toán hạng dưới ngưỡng vẫn là Syntax ERROR.
    for (const [expression, expected] of [
      ['+-'.repeat(24)+'1','1'], ['1'+'+1'.repeat(30),'31'],
      ['+-'.repeat(70),'Stack ERROR'], ['+-'.repeat(24),'Syntax ERROR'],
      ['+-'.repeat(25),'Stack ERROR'], ['-'.repeat(24),'Syntax ERROR'],
      ['-'.repeat(25),'Stack ERROR'], ['+'.repeat(50),'Syntax ERROR'],
      ['1'+'-'.repeat(24)+'1','2'], ['1'+'-'.repeat(25)+'1','Stack ERROR'],
      ['1+'+'-'.repeat(24)+'1','Stack ERROR'], ['+1','1']
    ]) {
      const signs = createEngine();
      for (const ch of expression) { if(ch==='+'||ch==='-')signs.inputOperator(ch);else signs.inputDigit(ch); }
      signs.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-04] stack chuỗi dấu '+expression, signs.getState().message || signs.getState().result, expected);
    }

    document.getElementById('test-summary').textContent = testCount + ' assert | ' + testFailCount + ' FAIL | ' + testPendingCount + ' pending | ' + testKnownDivergenceCount + ' known divergences';
    document.getElementById('test-failures').textContent = testFailures.join('\n');
    console.log('Đã chạy xong toàn bộ test.');
  </script>
