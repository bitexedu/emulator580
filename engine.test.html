  <script>
    // ===== QUY TẮC NHÃN — chốt bằng máy, không bằng trí nhớ =====
    // Mọi nhãn nói "ĐÃ XÁC NHẬN" BẮT BUỘC kèm ngày dạng YYYY-MM-DD. Lý do:
    // nhãn không ngày không cho biết ai bấm, bấm khi nào, nên KHÔNG đáng tin
    // hơn "chưa xác nhận" — dự án đã trả giá hai lần vì chuyện này (ca "0.(3)"
    // mang nhãn xác nhận mà vẫn sai; ca Verify "4" khai Syntax ERROR trong khi
    // máy cho ra "4=0"/False). Đặt chốt ngay trong check() để lần sau có quên
    // thì bộ test đỏ chứ không trôi im lặng.
    //
    // XUẤT XỨ CỦA CÁC NGÀY ĐIỀN NGÀY 2026-08-20: 98 nhãn cũ vốn không có ngày;
    // ngày của chúng lấy từ commit đã sinh ra dòng đó (git blame), vì thông
    // điệp commit ghi rõ đợt đó đối chiếu máy thật. Đây là bằng chứng GIÁN
    // TIẾP, yếu hơn ca tự bấm. Ca nào đã tự bấm lại trong đợt rà 2026-08-20
    // thì mang đúng ngày đó.
    function assertLabelDated(label) {
      // Nhãn không khai "ĐÃ XÁC NHẬN" thì không bị ràng buộc gì.
      if (!/ĐÃ XÁC NHẬN/.test(label)) return;
      // Có khai thì BẮT BUỘC kèm ngày. Chấp nhận cả
      // "[ĐÃ XÁC NHẬN 2026-08-20]" lẫn "[ĐÃ XÁC NHẬN, bấm lại 2026-08-17]"
      // — yêu cầu là CÓ NGÀY chứ không phải một khuôn chữ cứng.
      if (/\d{4}-\d{2}-\d{2}/.test(label)) return;
      console.assert(false, `FAIL: nhãn "ĐÃ XÁC NHẬN" thiếu ngày — ${label}`);
    }

    let testCount = 0, testFailCount = 0, testPendingCount = 0, testKnownDivergenceCount = 0;
    const testFailures = [];
    function check(label, actual, expected) {
      assertLabelDated(label);
      const pass = actual === expected;
      testCount++;
      if (!pass) {
        testFailCount++;
        testFailures.push(`${label} — nhận "${actual}", mong đợi "${expected}"`);
      }
      console.assert(pass, `FAIL: ${label} — nhận "${actual}", mong đợi "${expected}"`);
      if (pass) console.log(`OK: ${label}`);
    }

    // Ca ĐÃ đối chiếu máy thật nhưng engine CHƯA làm được. Ghi lại kỳ vọng
    // thật ngay từ bây giờ (đúng "Quy tắc test" trong CLAUDE.md: kết quả
    // mong đợi phải có TRƯỚC khi viết code), nhưng in "CHƯA LÀM" thay vì
    // "FAIL" để không lẫn với lỗi hồi quy thật sự. Khi làm xong tính năng,
    // đổi pending(...) thành check(...) — nếu nó tự pass sớm hơn dự kiến,
    // dòng "ĐÃ LÀM ĐƯỢC" bên dưới sẽ nhắc đổi.
    function pending(label, actual, expected) {
      testPendingCount++;
      if (actual === expected) {
        console.log(`ĐÃ LÀM ĐƯỢC (đổi pending → check): ${label}`);
      } else {
        console.log(`CHƯA LÀM: ${label} — nhận "${actual}", máy thật cho "${expected}"`);
      }
    }

    // 29.10: ngoại lệ do người dùng chấp nhận sau3 buổi; giữ nguyên số CASIO.
    // Đây là phép đối chiếu vẫn lệch, không phải assert đã khớp CASIO.
    function knownDivergence(label, actual, expected) {
      assertLabelDated(label);
      if (actual === expected) { check(label, actual, expected); return; }
      testKnownDivergenceCount++;
      console.log(`KHÁC BIỆT ĐÃ CHẤP NHẬN: ${label} — nhận "${actual}", CASIO "${expected}"`);
    }

    // Người dùng06/11 duyệt toán học đúng. Không đổi cột CASIO cũ:
    // vẫn in/đếm khác biệt, đồng thời bắt buộc khớp oracle toán học riêng.
    function checkMathPolicy(label, actual, casioExpected, mathExpected) {
      if (actual !== casioExpected) knownDivergence(label, actual, casioExpected);
      check('[TOÁN HỌC 2026-11-06] '+label, actual, mathExpected);
    }

    // Tiêu chí06/11: giữ seed khi chứng nhận vô nghiệm. Đuôi được tính độc lập
    // bằng Decimal từ chuỗi seed; không lấy đáp số SOLVE làm kỳ vọng.
    function mathSeedTail(seed) {
      const values = {"0": "-10000000", "4": "-9999996", "10000000": "0", "9999999": "-1", "10000000.1": "0.1", "10000005.3": "5.3", "10000005.4666667": "5.4666667", "9999998.86666628": "-1.13333372", "9999998.86656628": "-1.13343372", "9999998.86676628": "-1.13323372", "10000005.966667": "5.966667", "10000001": "1", "9999999.88888888": "-0.11111112", "9999999.5": "-0.5", "9999999.85185184": "-0.14814816", "9999999.2222222": "-0.7777778", "9999999.8888888": "-0.1111112", "9999999.88888885": "-0.11111115", "9999999.8888889": "-0.1111111"};
      if (!(seed in values)) throw new Error('Missing mathematical seed tail: '+seed);
      return values[seed];
    }

    function displayedNumber(text) {
      return Number(text.replace('×10','e').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g,
        ch => '0123456789-'['⁰¹²³⁴⁵⁶⁷⁸⁹⁻'.indexOf(ch)]));
    }
    // CASIO 2026-10-09: khôi phục tiêu chí tương thích ngày 2026-10-26.
    // Cột toán học 25.10 giữ để phân biệt, không dùng thay số đã đọc trên máy.
    {
      const enterPrecisionExpression = (engine, expression) => {
        for (const ch of expression) {
          if (ch === '.') engine.inputDot();
          else if (ch === '~') engine.inputNegative();
          else if ('+-÷×'.includes(ch)) engine.inputOperator(ch);
          else engine.inputDigit(ch);
        }
      };
      for (const [expression, expected, casioReference] of [
        ['0.940312212873109-0.0284943094178331-0.9118179', '3.4552759×10⁻⁹', '3.455275×10⁻⁹'],
        ['~0.940312212873109+0.0284943094178331+0.9118179', '-3.4552759×10⁻⁹', '-3.455275×10⁻⁹'],
        ['0.94031221287310-0.0284943094178331-0.9118179', '3.4552669×10⁻⁹', '3.455266×10⁻⁹'],
        ['0.98989898989899-0.366013604708183÷36.6050951256122-0.9799', '1.015444381×10⁻⁸', '1.0154443×10⁻⁸']
      ]) {
        const precisionEngine=createEngine(); enterPrecisionExpression(precisionEngine, expression); precisionEngine.equals();
        checkMathPolicy('[ĐÃ XÁC NHẬN 2026-10-09] cộng/trừ liên tiếp '+expression+' (toán học '+expected+')',precisionEngine.getState().result,casioReference,expected);
      }
      for (const [expression, anchor, expected, tolerance, casioReference] of [
        ['0.131213504406078÷4.60490206946226', '0.0284943', 9.417833185309486e-9, 4e-18, '9.4178331×10⁻⁹'],
        ['0.98989898989899-0.366013604708183÷36.6050951256122', '0.9799', 1.0154443806183754e-8, 1.2e-16, '1.0154443×10⁻⁸']
      ]) {
        const precisionEngine=createEngine(); enterPrecisionExpression(precisionEngine,expression); precisionEngine.equals();
        precisionEngine.clear(); precisionEngine.inputAns(); precisionEngine.inputOperator('-');typeNumber(precisionEngine,anchor);precisionEngine.equals();
        checkMathPolicy('[ĐÃ XÁC NHẬN 2026-10-09] trừ Ans sau '+expression, precisionEngine.getState().result,casioReference,formatNumber(expected));
      }
    }

    // CASIO 2026-11-03: đối chiếu số học trước khi ghép vào SOLVE.
    // 4 dự đoán đăng ký trước, ảnh/chuỗi phím/cột toán học trong QA.
    // Các kết quả khác toán học là kỳ vọng tương thích, không phải nghiệm.
    for (const [expression, expected] of [
      ['10000003²-100000000000000', '60000000'],
      ['10000003×10000003-100000000000000', '60000000'],
      ['10000003.0000002-10000000', '3'],
      ['1.00000030000002-1', '3×10⁻⁷'],
      ['10000003.0000009-10000000', '3'],
      ['10000003.0000011-10000000', '3.0000011'],
      ['10000003.000001-10000000', '3.000001'],
      ['10000004²-100000000000000', '80000016'],
      ['10000005²-100000000000000', '100000025']
    ]) {
      const arithmeticEngine=createEngine();
      arithmeticEngine.inputFunction(expression);arithmeticEngine.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-03] chuẩn hóa toán hạng '+expression+' trạng thái', arithmeticEngine.getState().mode,'result');
      checkMathPolicy('[ĐÃ XÁC NHẬN 2026-11-03] chuẩn hóa toán hạng '+expression, arithmeticEngine.getState().result,expected,MATH_QA[expression]);
    }

    // Đọc chữ số ẩn qua Ans: phân biệt chốt thương 15 chữ số với
    // làm tròn 16. Hai đối chứng 1.0000004/5 được dự đoán trước khi bấm.
    for (const [expression, anchor, expected] of [
      ['1.00000030000002×0.8-0.8', '0.00000024', '0'],
      ['1÷1.00000030000002-0.9', '0.0999997', '8.9×10⁻¹⁴'],
      ['1÷1.0000004-0.9', '0.0999996', '1.59×10⁻¹³'],
      ['1÷1.0000005-0.9', '0.0999995', '2.49×10⁻¹³']
    ]) {
      const arithmeticEngine=createEngine();arithmeticEngine.inputFunction(expression);arithmeticEngine.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-03] đọc đuôi '+expression+' trạng thái',arithmeticEngine.getState().mode,'result');
      arithmeticEngine.clear();arithmeticEngine.inputAns();arithmeticEngine.inputOperator('-');typeNumber(arithmeticEngine,anchor);arithmeticEngine.equals();
      checkMathPolicy('[ĐÃ XÁC NHẬN 2026-11-03] đọc đuôi '+expression+' rồi Ans−'+anchor,arithmeticEngine.getState().result,expected,MATH_QA[expression+'-'+anchor]);
    }

    // CASIO 2026-11-03: mẫu cố định ±10^-7 quanh0, không khẳng định h
    // hay quỹ đạo bên trong SOLVE. Không đổi golden18 ca hoặc timebox.
    {
      const balance='(3x-1)²-3x(3x-2)-0.99';
      const sampledCalc=(expression,seed)=>{
        const en=createEngine();en.inputFunction(expression);en.calc();typeNumber(en,seed);en.equals();en.equals();return en;
      };
      for(const [expression,seed,anchor,expected] of [
        ['(3x-1)²-0.99','0.0000001','0.0099994','9×10⁻¹⁴'],
        ['(3x-1)²-0.99','-0.0000001','0.0100006','0'],
        ['3x(3x-2)','0.0000001',null,'-5.9999991×10⁻⁷'],
        ['3x(3x-2)','-0.0000001',null,'6.0000009×10⁻⁷'],
        [balance,'0.0000001','0.01','0'],
        [balance,'-0.0000001','0.01','-9×10⁻¹⁴']
      ]) {
        const en=sampledCalc(expression,seed);
        check('[ĐÃ XÁC NHẬN 2026-11-03] mẫu quanh0 '+expression+' tại'+seed+' trạng thái',en.getState().mode,'result');
        if(anchor){en.clear();en.inputAns();en.inputOperator('-');typeNumber(en,anchor);en.equals();}
        checkMathPolicy('[ĐÃ XÁC NHẬN 2026-11-03] mẫu quanh0 '+expression+' tại'+seed+' đọc đuôi',en.getState().result,expected,expression===balance?'0':anchor?'9×10⁻¹⁴':expected);
      }
      let en=sampledCalc(balance,'-0.0000001');
      checkMathPolicy('[ĐÃ XÁC NHẬN 2026-11-03] phần dư hữu hạn không thành phân số1/100',JSON.stringify(en.getState().exactFraction??null),'null',JSON.stringify({negative:false,num:'1',den:'100'}));
      en.inputSto();en.inputVariable('B');en.clear();en.inputAlpha();en.inputVariable('B');en.inputOperator('-');typeNumber(en,'0.01');en.equals();
      checkMathPolicy('[ĐÃ XÁC NHẬN 2026-11-03] STO B giữ đuôi của mẫu âm',en.getState().result,'-9×10⁻¹⁴','0');
      en=createEngine();en.inputFunction('1÷6');en.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-03] phân số đúng1/6 vẫn chính xác',JSON.stringify(en.getState().exactFraction),JSON.stringify({negative:false,num:'1',den:'6'}));
      en.clear();en.inputAns();en.inputOperator('×');en.inputDigit('6');en.inputOperator('-');en.inputDigit('1');en.equals();
      check('[ĐÃ XÁC NHẬN 2026-11-03] dùng tiếp Ans1/6 không mất dạng hữu tỉ',en.getState().result,'0');
      // Phương trình tuyến tính phụ tách trạng thái SOLVE khỏi h/nhánh.
      // Ghi đúng cả L−R và đuôi x; chưa khớp thì pending, không nới kỳ vọng.
      for(const [A,tail] of [['0.0000001','0'],['-0.0000001','-9×10⁻¹⁴']]) {
        en=createEngine();typeNumber(en,A);en.inputSto();en.inputVariable('A');en.clear();typeNumber(en,'0.02');en.inputSto();en.inputXVariable();en.clear();
        en.inputFunction('x=(3A-1)²-3A(3A-2)-0.99');en.solve();en.equals();const state=en.getState();
        check('[ĐÃ XÁC NHẬN 2026-11-03] phương trình phụ A='+A+' trạng thái',state.mode,'solve');
        check('[ĐÃ XÁC NHẬN 2026-11-03] phương trình phụ A='+A+' x hiển thị',state.result,'0.01');
        en.clear();en.inputXVariable();en.inputOperator('-');typeNumber(en,'0.01');en.equals();
        pending('[ĐÃ XÁC NHẬN 2026-11-03] phương trình phụ quanh0 A='+A+' dư/kết thúc/đuôi',
          [state.residual,state.continue,en.getState().result].join('/'),['0',false,tail].join('/'));
      }
    }

    // BUG-062: đọc riêng chữ số lưu trong Ans ở hai vế tại x=10^7.
    // ĐÃ bấm CASIO 2026-10-21: CALC x=10000000, AC, Ans−46.506992=.
    // Hai kỳ vọng này kiểm tra số học log; nghiệm SOLVE bên dưới vẫn pending.
    for (const [rightSide,expected] of [[false,'4.62806×10⁻⁷'],[true,'4.628058×10⁻⁷']]) {
      const en=createEngine();if(rightSide)en.inputDigit('2');
      en.inputLogN();en.inputDigit('2');en.moveCursor('right');
      typeNumber(en,'10000000');
      if(rightSide){en.inputOperator('-');en.inputDigit('3');}
      else {
        en.inputOperator('²');en.inputOperator('-');en.inputDigit('6');
        en.inputOperator('×');typeNumber(en,'10000000');
        en.inputOperator('+');typeNumber(en,'19');
      }
      en.moveCursor('right');en.equals();en.clear();en.inputAns();
      en.inputOperator('-');typeNumber(en,'46.506992');en.equals();
      check('[ĐÃ XÁC NHẬN 2026-10-21] BUG-062 đuôi Ans vế '+(rightSide?'phải':'trái'),en.getState().result,expected);
    }

    // Đối chứng bổ sung BUG-060/062: chỉ hai đuôi tại 10^7 khớp chưa
    // chứng minh kernel căn/log hoặc nghiệm SOLVE đã sửa xong.
    // [ĐÃ XÁC NHẬN 2026-10-21] Các phép trừ Ans được bấm riêng trên CASIO.
    for(const [argument,anchor,expected] of [
      ['2','0.301029995','6.63981×10⁻¹⁰'],
      ['20000000000','10.301029995','6.639×10⁻¹⁰'],
      ['9999996.9','6.999999','8.6536869×10⁻⁷'],
      ['99999920000026','13.999999','6.525643×10⁻⁷']
    ]) {
      const en=createEngine();en.inputFunction('log(');typeNumber(en,argument);
      en.inputCloseParen();en.equals();en.clear();en.inputAns();
      en.inputOperator('-');typeNumber(en,anchor);en.equals();
      const label='[ĐÃ XÁC NHẬN 2026-10-21] BUG-062 đối chứng log10('+argument+') Ans−'+anchor;
      check(label,en.getState().result,expected);
    }
    {
      const en=createEngine();en.inputLogN();en.inputDigit('2');en.moveCursor('right');
      en.inputXVariable();en.inputOperator('²');en.inputOperator('-');en.inputDigit('6');
      en.inputXVariable();en.inputOperator('+');typeNumber(en,'19');en.moveCursor('right');
      en.calc();typeNumber(en,'9999999');en.equals();en.equals();
      en.clear();en.inputAns();en.inputOperator('-');typeNumber(en,'46.506992');en.equals();
      check('[ĐÃ XÁC NHẬN 2026-10-21] BUG-062 đuôi Ans vế trái tại x=9999999',en.getState().result,'1.742666×10⁻⁷');
    }
    // Phân biệt giảm thang log10 với làm tròn trực tiếp log10 toàn số.
    // CASIO 27.10: đối số gõ trực tiếp và sinh từ CALC có cùng đuôi Ans.
    for(const [expression,anchor,expected] of [
      ['logbase(2,99999917777804.7)','46.506992','1.422067×10⁻⁷'],
      ['log(99999917777804.7)','13.999999','6.429133×10⁻⁷'],
      ['log(5)','0.69897','4.336019×10⁻⁹'],
      ['logbase(2,100000000000010)','46.506993','3.284231×10⁻⁷']
    ]) {
      const en=createEngine();en.inputFunction(expression);en.equals();
      en.clear();en.inputAns();en.inputOperator('-');typeNumber(en,anchor);en.equals();
      check('[ĐÃ XÁC NHẬN 2026-10-27] log giảm thang '+expression+' rồi Ans−'+anchor,
        en.getState().result,expected);
    }
    {
      const en=createEngine();en.inputFunction('logbase(2,x²-6x+19)');en.calc();
      typeNumber(en,'9999998.88888889');en.equals();en.equals();
      en.clear();en.inputAns();en.inputOperator('-');typeNumber(en,'46.506992');en.equals();
      check('[ĐÃ XÁC NHẬN 2026-10-27] CALC log tại mẫu dưới của vòng hai BUG-062',
        en.getState().result,'1.422067×10⁻⁷');
    }
    // Đổi hệ số: mẫu phía trên phân biệt số học đối số với log đơn lẻ.
    for(const [expression,seed,expected] of [
      ['logbase(2,x²-4x+14)','10000000.9999998','3.9884×10⁻⁸'],
      ['2logbase(2,x-2)','10000000.9999998','3.9884×10⁻⁸'],
      ['logbase(2,x²-4x+14)','10000003.0000002','6.169617×10⁻⁷'],
      ['2logbase(2,x-2)','10000003.0000002','6.16962×10⁻⁷']

    // thử. J chỉ là tên trong tài liệu; nhập Int((x−A)÷B) ở cả hai vị trí.
    function solveZeroGateCase(power, a, b, initial) {
      const gateEngine = createEngine();
      for (const [name, value] of [['A',a], ['B',b],
          ['C','0.000000000000001'], ['x',initial]]) {
        gateEngine.clear(); typeNumber(gateEngine, value); gateEngine.inputSto();
        if (name === 'x') gateEngine.inputXVariable(); else gateEngine.inputVariable(name);
      }
      const enterGate = () => {
        gateEngine.inputFunction('Int('); gateEngine.inputOpenParen();
        gateEngine.inputXVariable(); gateEngine.inputOperator('-');
        gateEngine.inputAlpha(); gateEngine.inputVariable('A'); gateEngine.inputCloseParen();
        gateEngine.inputOperator('÷'); gateEngine.inputAlpha(); gateEngine.inputVariable('B');
        gateEngine.inputCloseParen();
      };
      gateEngine.clear(); gateEngine.inputXVariable(); gateEngine.inputPower();
      typeNumber(gateEngine, power); gateEngine.moveCursor('right'); gateEngine.inputOperator('×');
      gateEngine.inputOpenParen(); enterGate(); gateEngine.inputOperator('÷');
      gateEngine.inputOpenParen(); enterGate(); gateEngine.inputOperator('+');
      gateEngine.inputAlpha(); gateEngine.inputVariable('C'); gateEngine.inputCloseParen();
      gateEngine.inputCloseParen(); gateEngine.solve(); gateEngine.equals();
      return gateEngine;
    }

    // Mọi kỳ vọng dưới đây là kết quả tự bấm trên bản giả lập trong cùng ngày;

    // (1) Trần chu kỳ thập phân tuần hoàn. Máy hiện được chu kỳ dài hơn hẳn
    // con số 30 mà bản trước dùng. Luật theo ĐỘ DÀI CHU KỲ, không theo mẫu số.

      const en = createEngine();
      en.inputDigit('1'); en.inputOperator('÷');

      return en.getState().recurringDecimal;

    // (3) Equation: ◀/▶ lúc đang hiện nghiệm không làm gì; ▲/▼ vẫn cuộn nghiệm.

      const en = createEngine();
      en.setCalcMode('equation'); en.setEquationType('poly2');
      en.inputDigit('1'); en.equals();
      en.inputNegative(); en.inputDigit('3'); en.equals();
      en.inputDigit('2'); en.equals();

    // Bấm lại 26.10 sửa tham chiếu hệ số 2017: 2152, không phải 1952 cũ.
    function buildTeamLargePolynomial(en,coefficient) {
      en.inputXVariable(); en.inputPower(); en.inputDigit('5'); en.moveCursor('right');
      for(const [operator,power] of [['-','4'],['+','3'],['-','2'],['+','1']]) {
        en.inputOperator(operator); typeNumber(en,String(coefficient)); en.inputXVariable();
        if(power==='2') en.inputOperator('²');
        else if(power!=='1') {en.inputPower();en.inputDigit(power);en.moveCursor('right');}
      }
    }
    for(const [coefficient,seed,expected,casioReference] of [[2016,'2015','1940','2015'],[2017,'2016','2152','2016'],[2017,'0','0','0']]) {
      const polynomialEngine=createEngine(); buildTeamLargePolynomial(polynomialEngine,coefficient);
      polynomialEngine.calc(); typeNumber(polynomialEngine,seed); polynomialEngine.equals(); polynomialEngine.equals();
      const label='[ĐÃ XÁC NHẬN 2026-10-20/26] BUG-063 CALC hệ số '+coefficient+' x='+seed+' (toán học '+casioReference+')';
      checkMathPolicy(label,polynomialEngine.getState().result,expected,casioReference);
      if(coefficient===2016) {
        polynomialEngine.clear(); buildTeamLargePolynomial(polynomialEngine,coefficient); polynomialEngine.equals();
        checkMathPolicy(label+' tính thường dùng x đã lưu',polynomialEngine.getState().result,expected,casioReference);
      }

    function checkCubicRootPolicy(en,label,point,residual,root,casioStatus='Continue') {
      const st=en.getState();
      const state=st.mode==='error'?st.message:st.continue?'Continue':'Solved';
      knownDivergence(label+' trạng thái CASIO',state,casioStatus);
      if(point!==null)knownDivergence(label+' điểm CASIO',st.result,point);
      if(residual!==null)knownDivergence(label+' L−R CASIO',st.residual,residual);
      check('[TOÁN HỌC 2026-11-09] '+label+' nghiệm lưu và phần dư',
        [st.mode,st.continue,Math.abs(en.getVariables().x-root)<2e-14,

        'solve/false/true/true');

    const solveCubicFrom = start => {

    // Chốt zero sau Newton, phân biệt với điểm đầu đã underflow: không

    e = createEngine(); e.inputFunction('sin('); e.inputXVariable(); e.inputCloseParen();

    for (const [seed, expected] of [['1','0'], ['0.0000000001','1×10⁻¹⁰']]) {

    // CASIO nhận dạng bội π sau khuếch đại số nhỏ. Kiểm tra cả dấu,

    e = createEngine(); e.inputFunction('sin('); typeNumber(e, '-0.00000000000001'); e.inputCloseParen(); e.equals();
    e.clear(); e.inputAns(); e.inputOperator('×'); e.inputDigit('1'); e.inputTimesTenPower(); typeNumber(e, '16'); e.equals();
    checkPi('[ĐÃ XÁC NHẬN 2026-10-12] Ans từ sin(-10^-14) nhân 10^16 nhận dạng -5π/9',

    // CASIO 2026-10-13: F=(x³−2x+2)×J/(J+C), J=Int((x−A)/B).
    // Điểm xa trực tiếp và phục hồi từ zero cùng chốt vùng zero hẹp.
    function solveCubicRecoveryGate(a,b,seed) {
      const en=createEngine();
      for (const [name,value] of [['A',a],['B',b],['C','0.000000000000001'],['x',seed]]) {
        en.clear(); typeNumber(en,value); en.inputSto();
        if (name==='x') en.inputXVariable(); else en.inputVariable(name);
      }
      const enterJ=()=>{
        en.inputIntegerPart(); en.inputOpenParen(); en.inputXVariable(); en.inputOperator('-');
        en.inputAlpha(); en.inputVariable('A'); en.inputCloseParen(); en.inputOperator('÷');
        en.inputAlpha(); en.inputVariable('B'); en.inputCloseParen();
      };
      en.clear(); en.inputOpenParen(); en.inputXVariable(); en.inputPower(); en.inputDigit('3');
      en.moveCursor('right'); en.inputOperator('-'); en.inputDigit('2'); en.inputXVariable();
      en.inputOperator('+'); en.inputDigit('2'); en.inputCloseParen(); en.inputOperator('×');
      en.inputOpenParen(); enterJ(); en.inputOperator('÷'); en.inputOpenParen(); enterJ();
      en.inputOperator('+'); en.inputAlpha(); en.inputVariable('C');
      en.inputCloseParen(); en.inputCloseParen(); en.solve(); en.equals();
      return en;
    }
    for (const [a,b,seed,tail] of [
      ['6666666.6','0.1','10000000','0.067'],
      ['6666666.6666667','0.0000001','10000000','0'],
      ['6666666.6666667','0.0000001','0','0']
    ]) {
      const en=solveCubicRecoveryGate(a,b,seed);
      const label='[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cubic bước xa A='+a+' B='+b+' seed='+seed;
      check(label+' màn nghiệm',en.getState().mode,'solve');
      check(label+' giải x',en.getState().variable,'x');
      check(label+' điểm',en.getState().result,'6666666.667');
      check(label+' L−R',en.getState().residual,'0');
      check(label+' kết thúc',en.getState().continue,false);
      en.clear(); en.inputXVariable(); en.inputOperator('-'); en.inputAlpha(); en.inputVariable('A'); en.equals();
      check(label+' x lưu trừ A',en.getState().result,tail);

    // CASIO ClassPad 2026-10-13: cổng zero chặn tại các điểm phục hồi xa.

    // bằng chuỗi biểu thức; cổng chỉ làm điểm được thử đọc được trên LCD.
    for (const [constant, gateSign, expected] of [['2','-','10000000'], ['3.9','+','-10000000']]) {
      e = createEngine(); e.inputOpenParen(); e.inputXVariable(); e.inputPower(); e.inputDigit('3');
      e.moveCursor('right'); e.inputOperator('-'); e.inputDigit('2'); e.inputXVariable();

      e.inputIntegerPart(); e.inputXVariable(); e.inputOperator('÷'); typeNumber(e,'9999999');
      e.inputCloseParen(); e.inputCloseParen(); e.solve(); e.inputDigit('0'); e.equals(); e.equals();

      check(label + ' mở nghiệm', e.getState().mode, 'solve');

      check(label + ' L−R', e.getState().residual, '0');
      check(label + ' kết thúc', e.getState().continue, false);

    // CASIO 2026-10-13: bootstrap tại zero có Continue trước nghiệm.

      ['1','3','-8','2.002039627','0.0245004893'],
      ['1','3','1','0.6073803165','1.224069188'],

      check(label + ' mở kết quả', e.getState().mode, 'solve');
      check(label + ' Continue', e.getState().continue, true);
      pending(label + ' x', e.getState().result, point);
      pending(label + ' L−R', e.getState().residual, residual);
      // Bấm tiếp = trên CASIO: cả năm ca kết thúc; riêng +1 chọn -1.
      e.equals();

      check(label + ' lượt hai mở nghiệm', e.getState().mode, 'solve');
      check(label + ' lượt hai x', e.getState().result, nextRoot);
      check(label + ' lượt hai L−R', e.getState().residual, '0');
      check(label + ' lượt hai kết thúc', e.getState().continue, false);
    }
    e = createEngine(); e.setAngleUnit('rad'); e.inputFunction('cos('); e.inputXVariable();
    e.inputCloseParen(); e.inputOperator('-'); typeNumber(e,'0.5');
    e.solve(); e.inputDigit('0'); e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos(x)−0.5 Radian từ 0 kết thúc', e.getState().continue, false);
    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos(x)−0.5 Radian từ 0 L−R', e.getState().residual, '0');
    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos(x)−0.5 Radian từ 0 chọn nhánh', e.getState().result, '99.48376736');

    // CASIO giữ x sau SOLVE; tính lại phần dư thường vẫn bằng 0.
    e.clear(); e.inputFunction('cos('); e.inputXVariable(); e.inputCloseParen();
    e.inputOperator('-'); typeNumber(e,'0.5'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-10-13] Calculate cos(x)−0.5 từ x SOLVE Radian', e.getState().result, '0');

    // CASIO Calculate Radian: hai góc nhập kề nhau cùng chốt 1/2.
    // Mô hình hiện tại mới khớp góc thứ nhất; không nới ngưỡng để ép ca sau.
    for (const [argument, expectCosResidual] of [['1.0471975511966',check], ['1.04719755119661',pending]]) {
      e = createEngine(); e.setAngleUnit('rad'); e.inputFunction('cos('); typeNumber(e,argument);
      e.inputCloseParen(); e.inputOperator('-'); typeNumber(e,'0.5'); e.equals();

    const solveCosZero = (unit, tiny = false, gate = false, constant = '0.5') => {

        en.inputCloseParen(); en.inputOperator('×'); en.inputOpenParen(); en.inputDigit('1');

    for (const [unit, tiny, gate, expected, residual] of [

      check(label + ' mở nghiệm', state.mode, 'solve');

    const gradCosEngine = solveCosZero('grad');

    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos zero Grad kết thúc', gradCosZero.continue, false);
    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos zero Grad nhánh x', gradCosZero.result, '312466.6667');
    pending('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos zero Grad L−R', gradCosZero.residual, '9.07×10⁻¹²');

    // CASIO: đọc thêm phần đuôi x lưu, không suy từ 10 chữ số trên LCD.

    typeNumber(gradCosEngine,'312466.666666'); gradCosEngine.equals();
    // Nghiệm toán học 312466+2/3; đọc CASIO sau trừ mốc cho 6.66×10⁻⁷.
    // Phép trừ chính xác trên x đã lưu312466.6666666667; không tuyên bố

      gradCosEngine.getState().result,'6.66×10⁻⁷','6.667×10⁻⁷');
    // Hai cổng Int phân biệt các điểm nửa kế tiếp, kể cả điểm mà |f| tăng.

      check(label + ' điểm nửa',state.result,expected);
      check(label + ' L−R',state.residual,'0');
      check(label + ' kết thúc',state.continue,false);
    }
    const gradQuarter = solveCosZero('grad',false,false,'0.25').getState();
    const quarterLabel = '[ĐÃ XÁC NHẬN 2026-10-13] SOLVE cos Grad trừ 0.25 từ zero';
    check(quarterLabel + ' màn nghiệm',gradQuarter.mode,'solve');
    check(quarterLabel + ' nhánh x',gradQuarter.result,'312483.9139');
    check(quarterLabel + ' kết thúc',gradQuarter.continue,false);
    pending(quarterLabel + ' L−R',gradQuarter.residual,'-5.06×10⁻¹³');

    // Không tạo nghiệm cho cực tiểu cùng dấu dù mở tìm kiếm điểm xa.

    e.solve(); e.inputDigit('0'); e.equals(); e.equals();

    check('[ĐÃ XÁC NHẬN 2026-10-13] SOLVE x²+1 từ zero không có nghiệm', e.getState().message, 'Cannot Solve');

    // +3.9 phân biệt Continue đang tiến về nghiệm với Continue mắc: CASIO
    // đã ở x âm sau đợt đầu, và đợt thứ hai kết thúc với L−R=0 từ cả 0/2.
    for (const start of ['0', '2']) {
      e = createEngine(); e.inputXVariable(); e.inputPower(); e.inputDigit('3');
      e.moveCursor('right'); e.inputOperator('-'); e.inputDigit('2');
      e.inputXVariable(); e.inputOperator('+'); e.inputDigit('3'); e.inputDot(); e.inputDigit('9');
      e.solve(); e.inputDigit(start); e.equals(); e.equals();
      const label = '[ĐÃ XÁC NHẬN 2026-09-23] Solve x³−2x+3.9 từ ' + start;
      check(label + ' mở màn nghiệm', e.getState().mode, 'solve');
      check(label + ' có Continue', e.getState().continue, true);
      check(label + ' Continue điểm', e.getState().result, '-1.995548282');
      pending(label + ' Continue L−R', e.getState().residual, '-0.055601643');
      e.equals();
      check(label + ' lượt hai mở nghiệm', e.getState().mode, 'solve');
      check(label + ' lượt hai nghiệm', e.getState().result, '-1.989939372');
      check(label + ' lượt hai L−R', e.getState().residual, '0');
      check(label + ' lượt hai kết thúc', e.getState().continue, false);

    e.solve(); e.inputNegative(); e.inputDigit('1'); e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-23] Solve x³−2x+3.9 từ −1 trả nghiệm âm', e.getState().result, '-1.989939372');

    check('[ĐÃ XÁC NHẬN 2026-09-23] Solve x³−3x²+x+4.5 từ 1 L−R', e.getState().residual, '0');
    check('[ĐÃ XÁC NHẬN 2026-09-23] Solve x³−3x²+x+4.5 từ 1 kết thúc', e.getState().continue, false);

    // Hai cách gõ cùng lũy thừa cũng cho đúng cùng điểm Continue khi Solve

    e = createEngine();

    const solveCubicKey = useCubeKey => {

    check('[ĐÃ XÁC NHẬN 2026-09-23] Solve x³ và x^3 cùng L−R', cubeKeyState.residual, powerKeyState.residual);

    pending('[ĐÃ XÁC NHẬN 2026-09-23] Solve 2x³−4x+7.8 Continue điểm', e.getState().result, '-1.995548276');
    pending('[ĐÃ XÁC NHẬN 2026-09-23] Solve 2x³−4x+7.8 Continue L−R', e.getState().residual, '-0.111203162');

    check('[ĐÃ XÁC NHẬN 2026-09-23] Solve 2x³−4x+7.8 lượt hai nghiệm', e.getState().result, '-1.989939372');

    // Không có toán tử quan hệ → máy TỰ THÊM "=0" rồi so sánh, KHÔNG báo lỗi.
    // Test cũ ở đây khai "Syntax ERROR" và mang nhãn đã-xác-nhận, nhưng thực
    // ra chưa ai bấm — bấm ngày 2026-08-20 thì máy ra "4=0" / False.
    // Ba ca dưới đây phân biệt được: nếu máy chỉ báo lỗi thì cả ba đã như nhau.
    e = verifyEngine();
    e.inputDigit('4'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-20] Verify "4" → máy tự thành "4=0", cho False',
      e.getState().verifyResult, false);
    check('[ĐÃ XÁC NHẬN 2026-08-20] Verify "4" → dòng biểu thức hiện "4=0"',
      e.getState().expression, '4=0');
    e = verifyEngine();
    e.inputDigit('8'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-20] Verify "8" → "8=0", cho False', e.getState().verifyResult, false);
    e = verifyEngine();
    e.inputDigit('0'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-20] Verify "0" → "0=0", cho True', e.getState().verifyResult, true);

    // Ans nhận 1 khi True, 0 khi False (manual tr.176). state.result chính là
    // giá trị Ans nên kiểm qua đó.
    e = verifyEngine();
    e.inputDigit('4'); e.inputRelational('='); e.inputDigit('4'); e.equals();
    check('[MANUAL tr.176] Verify True → Ans = 1', e.getState().result, '1');

    e = verifyEngine();
    e.inputDigit('4'); e.inputRelational('='); e.inputDigit('5'); e.equals();
    check('[MANUAL tr.176] Verify False → Ans = 0', e.getState().result, '0');
    check('[MANUAL tr.176] Verify False → hiện False', e.getState().verifyResult, false);

    // Biến A-F mang giá trị đang gán vào trong Verify (manual tr.176) — tức
    // biến là kho DÙNG CHUNG giữa các mode, không bị xoá khi đổi mode.
    e = createEngine();
    e.inputDigit('7'); e.inputSto(); e.inputVariable('A');
    e.setCalcMode('verify');
    e.inputAlpha(); e.inputVariable('A'); e.inputRelational('='); e.inputDigit('7');
    e.equals();
    check('[MANUAL tr.176] STO 7→A ở Calculate, rồi Verify A=7 → True',
      e.getState().verifyResult, true);

    // Đổi mode xoá màn hình đang gõ (biểu thức có dấu "=" mang sang Calculate
    // là vô nghĩa). ĐÃ XÁC NHẬN 2026-08-18 trên bản giả lập: vào Verify
    // (MENU → ALPHA B), gõ "9", rồi MENU → 1:Calculate — màn hình chỉ còn con
    // trỏ, số 9 mất hẳn.
    e = verifyEngine();
    e.inputDigit('9');
    e.setCalcMode('calculate');
    check('[ĐÃ XÁC NHẬN 2026-08-18] đổi mode xoá biểu thức đang gõ', e.getState().buffer, '');
    check('[ĐÃ XÁC NHẬN 2026-08-18] đổi mode về lại calculate', e.getCalcMode(), 'calculate');

    // Mode Calculate KHÔNG được dính cờ verifyResult — nếu dính, mọi phép
    // tính thường sẽ hiện "True"/"False" thay cho số.
    e = createEngine();
    e.inputDigit('2'); e.inputOperator('+'); e.inputDigit('3'); e.equals();
    check('mode Calculate không có verifyResult', e.getState().verifyResult, undefined);
    check('mode Calculate 2+3= vẫn ra 5', e.getState().result, '5');

    // √2×√2 = 2 — ca PHÂN BIỆT hai giả định về cách so sánh: so sánh thô cho
    // False (2.0000000000000004), so sánh sau khi làm tròn 10 chữ số có
    // nghĩa cho True. Máy thật cho True (2026-08-17) → máy CÓ làm tròn trước
    // khi so sánh, đúng như engine đang làm.
    e = verifyEngine();
    e.inputSqrt(); e.inputDigit('2'); e.moveCursor('right');
    e.inputOperator('×');
    e.inputSqrt(); e.inputDigit('2'); e.moveCursor('right');
    e.inputRelational('='); e.inputDigit('2'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-20] Verify √2×√2=2 → True (máy so sánh sau khi làm tròn)',
      e.getState().verifyResult, true);

    // ===== Tầng 7 — mode Ratio + Bộ soạn thảo hệ số =====
    // Nguồn: docs/fx-580VNX_VI.pdf trang 178 (Ratio) và trang 164 (mô tả bộ
    // soạn thảo hệ số trong mode Equation — cùng một màn hình).
    //
    // Mục này ban đầu suy từ manual (chuỗi phím trong manual là ảnh nên không
    // đọc được). ĐÃ ĐỐI CHIẾU HẾT trên bản giả lập 2026-08-17 và 2026-08-18,
    // kể cả phần "=" đăng ký ô rồi sang ô kế; ca nào cũng ghi ngày ở nhãn.

    // Gõ một chuỗi số vào ô đang chọn.
    // Đọc một DÒNG của mẫu inline thành chuỗi dễ so sánh: {n} là ô hệ số,
    // ±n là chỗ đặt dấu lấy theo dấu của ô n, còn lại là chữ cố định.
    function templateRow(state, row) {
      return state.template[row].map((i) => (
        i.text !== undefined ? i.text : (i.signOf !== undefined ? '±' + i.signOf : '{' + i.cell + '}')
      )).join('');
    }

    // ===== Ca biên và mã lỗi (Giai đoạn 3, nhóm 2) =====
    // Sáu ca dưới đây ĐÃ XÁC NHẬN 2026-08-17 trên bản giả lập chính hãng.
    // Chúng phân biệt được hai mã lỗi với nhau: chia 0 / ngoài miền xác định
    // ra Math ERROR, còn biểu thức viết sai cú pháp ra Syntax ERROR. Đáng chú
    // ý: giai thừa của số không nguyên ra Math ERROR chứ KHÔNG phải
    // "Argument ERROR" như tên gọi có thể gợi ý.
    e = createEngine();
    typeNumber(e, '1'); e.inputOperator('÷'); typeNumber(e, '0'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] 1÷0= → Math ERROR', e.getState().message, 'Math ERROR');

    e = createEngine();
    e.inputSqrt(); e.inputNegative(); typeNumber(e, '1'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] √(−1)= → Math ERROR', e.getState().message, 'Math ERROR');

    e = createEngine();
    e.inputFunction('ln('); typeNumber(e, '0'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ln(0)= → Math ERROR', e.getState().message, 'Math ERROR');

    e = createEngine();
    typeNumber(e, '1.5'); e.inputFunction('!'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] 1.5!= → Math ERROR (không phải Argument ERROR)',
      e.getState().message, 'Math ERROR');

    e = createEngine();
    typeNumber(e, '2'); e.inputOperator('+'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] "2+" thiếu vế phải → Syntax ERROR',
      e.getState().message, 'Syntax ERROR');

    e = createEngine();
    typeNumber(e, '2'); e.inputOperator('+'); e.inputOperator('×'); typeNumber(e, '3'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] "2+×3" hai toán tử liền → Syntax ERROR',
      e.getState().message, 'Syntax ERROR');

    // Tràn số và miền xác định lượng giác — ĐÃ XÁC NHẬN 2026-08-17.
    e = createEngine();
    e.inputFunction('tan('); typeNumber(e, '90'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] (Deg) tan(90)= → Math ERROR',
      e.getState().message, 'Math ERROR');

    e = createEngine();
    typeNumber(e, '9'); e.inputPower(); typeNumber(e, '9999'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] 9^9999= tràn số → Math ERROR',
      e.getState().message, 'Math ERROR');

    // Màn hình lỗi mời "[◀][▶]:Goto": bấm ◀ quay lại chính biểu thức để sửa,
    // KHÔNG xoá. Ca phân biệt được: nếu ◀ xoá biểu thức thì bấm "=" ngay sau
    // đó sẽ không ra kết quả nào.
    e = createEngine();
    typeNumber(e, '1'); e.inputOperator('÷'); typeNumber(e, '0'); e.equals();
    e.moveCursor('left');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ◀ ở màn hình lỗi → về lại màn hình nhập',
      e.getState().mode, 'input');
    e.deleteLast(); typeNumber(e, '2'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...biểu thức còn nguyên, sửa 0 thành 2 ra 0.5',
      e.getState().result, '0.5');

    function typeNumber(engine, text) {
      for (const ch of text) {
        if (ch === '.') engine.inputDot();
        else if (ch === '-') engine.inputNegative();
        else engine.inputDigit(ch);
      }
    }

    // Ô hệ số nhận BIỂU THỨC đầy đủ, không phải chỉ chữ số — ĐÃ XÁC NHẬN
    // 2026-08-17 trên bản giả lập chính hãng. Bốn ca dưới đây phân biệt được
    // đúng bốn điều mà thiết kế cũ ("ô chỉ giữ một con số") làm sai.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '2'); e.inputOperator('+'); typeNumber(e, '3');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] gõ "2+3" vào ô A rồi "=" ghi 5',
      e.getState().cells[0].text, '5');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...rồi nhảy sang ô B',
      e.getState().cells.findIndex((c) => c.selected), 1);

    // Phân số gõ được vào ô: dùng chung cây node Tầng 5 nên phím a b/c chạy.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    e.inputFraction(); typeNumber(e, '1'); e.moveCursor('down'); typeNumber(e, '2');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] gõ phân số 1/2 vào ô A rồi "=" ghi 0.5',
      e.getState().cells[0].text, '0.5');

    // ◀ đi trong BIỂU THỨC chứ không đổi ô, và DEL xoá ký tự trước con trỏ:
    // gõ "2+3", ◀ rồi DEL phải ra "23" (bấm thử trên bản giả lập).
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '2'); e.inputOperator('+'); typeNumber(e, '3');
    e.moveCursor('left'); e.deleteLast(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ◀ rồi DEL trong ô cho "23", ô A = 23',
      e.getState().cells[0].text, '23');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...và ◀ KHÔNG đổi ô đang chọn',
      e.getState().cells.findIndex((c) => c.selected), 1);

    // AC lúc đang gõ dở chỉ xoá phần gõ dở: hệ số đã đăng ký giữ nguyên và ô
    // đang chọn không đổi (thử trên máy: A=7, gõ 5 vào ô B rồi AC).
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '7'); e.equals();
    typeNumber(e, '5'); e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-17] AC lúc gõ dở: hệ số A vẫn là 7',
      e.getState().cells[0].text, '7');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...ô đang chọn vẫn là B',
      e.getState().cells.findIndex((c) => c.selected), 1);
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...và phần gõ dở biến mất',
      e.getState().draftNodes === undefined, true);
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-17] AC lần nữa (không gõ dở) mới xoá về 0',
      e.getState().cells.map((c) => c.text).join(','), '0,0,0');

    // Nhập đủ hệ số rồi bấm "=" thêm một lần để ra nghiệm.
    function solveRatioWith(typeId, coefficients) {
      const engine = createEngine();
      engine.setCalcMode('ratio');
      engine.setRatioType(typeId);
      coefficients.forEach((value) => {
        typeNumber(engine, value);
        engine.equals();
      });
      engine.equals();
      return engine;
    }

    // Ví dụ 1 (manual tr.178): 1:2 = X:10 → X = 5
    e = solveRatioWith('ABXD', ['1', '2', '10']);
    check('[MANUAL tr.178] Ratio 1:2=X:10 → X=5', e.getState().result, '5');

    // Ví dụ 2 (manual tr.178): 1:2 = 10:X → X = 20
    e = solveRatioWith('ABCX', ['1', '2', '10']);
    check('[MANUAL tr.178] Ratio 1:2=10:X → X=20', e.getState().result, '20');

    // Ví dụ ở bước 3 (manual tr.178): 3:8 = X:12 → X = 4.5
    e = solveRatioWith('ABXD', ['3', '8', '12']);
    check('[MANUAL tr.178] Ratio 3:8=X:12 → X=4.5', e.getState().result, '4.5');

    // ...nhưng máy HIỆN ra dạng phân số chính xác trước, không phải 4.5.
    // ĐÃ XÁC NHẬN 2026-08-17 trên bản giả lập chính hãng: màn hình vẽ 9/2 xếp
    // tầng; bấm S⇔D mới ra 4.5. Ca này phân biệt được hai cách hiểu vì 9/2 là
    // phân số thật sự (mẫu ≠ 1) — nếu engine trả số thực thì exactFraction
    // không tồn tại.
    e = solveRatioWith('ABXD', ['3', '8', '12']);
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ratio 3:8=X:12 hiện phân số 9/2',
      e.getState().exactFraction.num + '/' + e.getState().exactFraction.den, '9/2');
    e.toggleExactDecimal();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...S⇔D đổi sang thập phân 4.5',
      e.getState().exactFraction === undefined && e.getState().result === '4.5', true);

    // Nghiệm nguyên thì không có phân số để vẽ — vẫn hiện số trần.
    e = solveRatioWith('ABXD', ['1', '2', '10']);
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ratio nghiệm nguyên không kèm phân số',
      e.getState().exactFraction === undefined, true);

    // Màn hình nhập là CHÍNH cái tỷ lệ, không phải danh sách ô có nhãn — ĐÃ
    // XÁC NHẬN 2026-08-17: kiểu 1 hiện `▓0▓:__0 = X:__0`. Engine cấp `template`
    // mô tả chỗ đặt từng ô; UI chỉ vẽ theo, không tự đoán bố cục.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ratio kiểu 1: mẫu inline A:B = X:D',
      templateRow(e.getState(), 0), '{0}:{1} = X:{2}');
    e.setRatioType('ABCX');
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ratio kiểu 2: mẫu inline A:B = C:X',
      templateRow(e.getState(), 0), '{0}:{1} = {2}:X');

    // "Math ERROR sẽ xảy ra nếu bạn thực hiện tính toán trong khi 0 là đầu
    // vào cho hệ số" (manual tr.178) — thử 0 ở cả vị trí tử lẫn mẫu.
    e = solveRatioWith('ABXD', ['0', '8', '12']);
    check('[MANUAL tr.178] Ratio hệ số A=0 → Math ERROR', e.getState().message, 'Math ERROR');

    e = solveRatioWith('ABXD', ['3', '0', '12']);
    check('[MANUAL tr.178] Ratio hệ số B=0 → Math ERROR', e.getState().message, 'Math ERROR');

    e = solveRatioWith('ABXD', ['3', '8', '0']);
    check('[MANUAL tr.178] Ratio hệ số D=0 → Math ERROR', e.getState().message, 'Math ERROR');

    // Mỗi kiểu tỷ lệ hỏi đúng bộ ô của nó.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    check('[MANUAL tr.178] kiểu A:B=X:D hỏi 3 ô A,B,D',
      e.getState().cells.map((c) => c.label).join(''), 'ABD');
    e.setRatioType('ABCX');
    check('[MANUAL tr.178] kiểu A:B=C:X hỏi 3 ô A,B,C',
      e.getState().cells.map((c) => c.label).join(''), 'ABC');

    // "Thay đổi loại biểu thức tỷ lệ làm cho các giá trị của mọi hệ số bị
    // đổi thành không" (manual tr.178).
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '7'); e.equals();
    e.setRatioType('ABCX');
    check('[MANUAL tr.178] đổi kiểu tỷ lệ → mọi hệ số về 0',
      e.getState().cells.map((c) => c.text).join(','), '0,0,0');

    // AC đặt lại mọi hệ số về KHÔNG, kể cả ở Ratio — GIỐNG mode Equation.
    // Câu "đặt lại tất cả các hệ số thành một" (manual tr.178) không có nghĩa
    // "thành giá trị 1": bấm AC khi đang có 3:8=X:12 trên bản giả lập chính
    // hãng cho ra 0:0 = X:0.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '7'); e.equals();
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-17] AC ở Ratio → mọi hệ số về 0',
      e.getState().cells.map((c) => c.text).join(','), '0,0,0');

    // Từ màn hình nghiệm, AC chỉ quay về Bộ soạn thảo và GIỮ hệ số; phải bấm
    // AC lần thứ hai mới xoá về 0 (đã xác nhận cùng lượt bấm ở trên).
    e = solveRatioWith('ABXD', ['3', '8', '12']);
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-17] AC lần 1 từ màn hình nghiệm → giữ hệ số',
      e.getState().cells.map((c) => c.text).join(','), '3,8,12');
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-17] AC lần 2 → mới xoá về 0',
      e.getState().cells.map((c) => c.text).join(','), '0,0,0');

    // AC cũng phải thoát được khỏi trạng thái lỗi, giống mọi mode khác.
    // ĐÃ XÁC NHẬN 2026-08-18: A=0, B=8, D=12 → "=" ra Math ERROR; AC đưa về Bộ
    // soạn thảo, VẪN ở Ratio, hệ số còn nguyên 0/8/12 và ô đang chọn vẫn là ô
    // D — không nhảy về ô đầu, không xoá gì.
    e = solveRatioWith('ABXD', ['0', '8', '12']);
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-18] AC thoát Math ERROR ở mode Ratio', e.getState().mode, 'ratio');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ...hệ số còn nguyên',
      e.getState().cells.map((c) => c.text).join(','), '0,8,12');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ...và vẫn đứng ở ô D',
      e.getState().cells.findIndex((c) => c.selected), 2);

    // Ô đang chọn dịch theo mỗi lần "=" đăng ký giá trị.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    check('[ĐÃ XÁC NHẬN 2026-08-17] mới vào Ratio thì ô A đang được chọn',
      e.getState().cells.findIndex((c) => c.selected), 0);
    typeNumber(e, '5'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] "=" đăng ký ô A rồi sang ô B',
      e.getState().cells.findIndex((c) => c.selected), 1);
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...và ô A giữ giá trị vừa nhập',
      e.getState().cells[0].text, '5');
    // ▶ khi KHÔNG gõ dở thì chuyển sang ô kế (bấm thử: ô B → ô D).
    e.moveCursor('right');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ▶ lúc không gõ dở chuyển sang ô kế',
      e.getState().cells.findIndex((c) => c.selected), 2);

    // Phím mũi tên chuyển ô. Ở Ratio ba ô nằm trên MỘT HÀNG NGANG
    // (`▓0▓:__0 = X:__0`), nên chỉ ◀▶ đổi ô — ▲▼ KHÔNG có tác dụng.
    // ĐÃ XÁC NHẬN 2026-08-18 trên bản giả lập: ▼ bấm ba lần ở ô A rồi một lần
    // nữa ở ô B đều đứng yên, ▲ ở ô D cũng vậy; ◀▶ thì chạy và dừng ở hai đầu.
    // Bản trước khai lưới một cột nên ▼ chạy 0→1→2 — SAI, đã sửa ở engine.js.
    const cellIndex = (engine) => engine.getState().cells.findIndex((c) => c.selected);
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    e.moveCursor('up');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▲ ở ô đầu đứng yên', cellIndex(e), 0);
    e.moveCursor('down'); e.moveCursor('down'); e.moveCursor('down');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▼ ở Ratio không đổi ô', cellIndex(e), 0);
    e.moveCursor('right');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▶ sang ô kế', cellIndex(e), 1);
    e.moveCursor('down');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▼ ở ô giữa cũng đứng yên', cellIndex(e), 1);
    e.moveCursor('right');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▶ tới ô cuối', cellIndex(e), 2);
    e.moveCursor('right');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▶ ở ô cuối dừng lại', cellIndex(e), 2);
    e.moveCursor('up');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ▲ ở ô cuối đứng yên', cellIndex(e), 2);
    e.moveCursor('left');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ◀ lùi một ô', cellIndex(e), 1);

    // Ô hệ số KHÔNG chặn phím ở chữ số thứ 11 — ĐÃ XÁC NHẬN 2026-08-17: gõ
    // "123456789012" vào ô A thì dòng nhập nhận hết 12 chữ số, bấm "=" ghi
    // vào ô và ô hiện 1.23456789×10¹¹. Tức giá trị vào TRỌN rồi mới làm tròn
    // 10 chữ số có nghĩa như mọi kết quả khác. Ca này phân biệt được hai cách
    // hiểu: chặn phím thì ô phải giữ đúng 1234567890.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '123456789012');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ô hệ số nhận trọn 12 chữ số, không chặn',
      e.getState().cells[0].text, '1.23456789×10¹¹');

    // Nghiệm Ratio KHÔNG ghi vào Ans — ĐÃ XÁC NHẬN 2026-08-17. Ca thử phân
    // biệt được gồm HAI vế: (1) Ans sống sót qua việc đổi mode, (2) giải Ratio
    // xong Ans vẫn là giá trị cũ. Thiếu vế (1) thì không kết luận được, vì
    // Ans bằng 0 có thể chỉ do đổi mode làm mất Ans.
    // Phần quan sát được từ ngoài lúc này: nghiệm vẫn ra đúng và vẫn có dạng
    // phân số chính xác RIÊNG của Ratio, dù không còn mượn slot Ans nữa.
    e = solveRatioWith('ABXD', ['3', '8', '12']);
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ratio không ghi Ans mà vẫn giữ dạng 9/2',
      e.getState().exactFraction.num + '/' + e.getState().exactFraction.den, '9/2');
    e.toggleExactDecimal();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...và S⇔D vẫn đổi được sang 4.5',
      e.getState().exactFraction === undefined && e.getState().result === '4.5', true);

    // Vế còn lại, giờ đã test được vì phím Ans đã mở. Hai ca đi cùng nhau:
    // ca đầu chứng minh Ans SỐNG SÓT qua việc đổi mode, ca sau chứng minh
    // Ratio không ghi đè lên nó. Thiếu ca đầu thì con số 5 ở ca sau có thể bị
    // giải thích nhầm là do Ratio ghi rồi bị xoá.
    e = createEngine();
    typeNumber(e, '2'); e.inputOperator('+'); typeNumber(e, '3'); e.equals();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    e.setCalcMode('calculate');
    e.inputAns(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] Ans sống sót qua việc đổi mode',
      e.getState().result, '5');

    e = createEngine();
    typeNumber(e, '2'); e.inputOperator('+'); typeNumber(e, '3'); e.equals();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    ['3', '8', '12'].forEach((v) => { typeNumber(e, v); e.equals(); });
    e.equals();
    e.setCalcMode('calculate');
    e.inputAns(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...giải Ratio xong Ans vẫn là 5',
      e.getState().result, '5');

    // Phím Ans ở mode Calculate: chèn kết quả gần nhất vào biểu thức đang gõ.
    // ĐÃ XÁC NHẬN 2026-08-17: sau kết quả 2000, bấm + rồi Ans cho "Ans+Ans"
    // = 4000.
    e = createEngine();
    typeNumber(e, '2'); e.inputOperator('×'); typeNumber(e, '1000'); e.equals();
    e.inputOperator('+'); e.inputAns(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] 2×1000=, rồi + Ans = → Ans+Ans = 4000',
      e.getState().result, '4000');

    // Ghi chú cũ về phím Ans còn khoá:
    // và đổi mode đưa màn hình về trạng thái 'input' nên phím +−×÷ không chèn
    // "Ans" như khi đang hiện kết quả. Viết test giả ở đây sẽ chỉ kiểm tra
    // chính giả định của mình, không kiểm tra được hành vi thật.

    // Đổi mode qua lại không rò trạng thái: Ratio → Calculate phải trả lại
    // đúng màn hình gõ biểu thức, không còn lưới ô.
    e = createEngine();
    e.setCalcMode('ratio'); e.setRatioType('ABXD');
    typeNumber(e, '9');
    e.setCalcMode('calculate');
    check('Ratio → Calculate: về đúng màn hình nhập biểu thức', e.getState().mode, 'input');
    check('Ratio → Calculate: màn hình trống', e.getState().buffer, '');
    e.inputDigit('2'); e.inputOperator('+'); e.inputDigit('3'); e.equals();
    check('Ratio → Calculate: 2+3= vẫn ra 5', e.getState().result, '5');

    // ===== Tầng 7 — mode Equation/Func (hệ 2-4 ẩn + bậc 2) =====
    // Nguồn: docs/fx-580VNX_VI.pdf trang 164-171, Excel Functional Spec
    // EQ-001…EQ-013.
    //
    // Ví dụ tính toán trong manual bị mất phần KẾT QUẢ (là ảnh), nên kết quả
    // mong đợi ban đầu do tôi tính theo toán chuẩn. ĐÃ ĐỐI CHIẾU HẾT trên bản
    // giả lập chính hãng 2026-08-18 — mọi ca đều khớp, engine không phải sửa.
    // Đường đi trên máy: MENU → 9:Equation/Func → 1:Simul Equation (hỏi
    // "Number of Unknowns? Select 2~4") hoặc 2:Polynomial (hỏi "Degree?
    // Select 2~4"). Nhập xong hệ số CUỐI bấm "=" thì con trỏ vẫn ở trong Bộ
    // soạn thảo; phải bấm "=" LẦN NỮA mới giải — đúng như engine đang mô
    // hình hoá.

    function solveEquationWith(typeId, coefficients) {
      const engine = createEngine();
      engine.setCalcMode('equation');
      engine.setEquationType(typeId);
      coefficients.forEach((value) => {
        typeNumber(engine, String(value));
        engine.equals();
      });
      engine.equals();
      return engine;
    }

    // Mô tả gọn một nghiệm để so sánh trong test.
    function rootText(state) {
      const result = state.result;
      if (!result) return 'null';
      if (result.kind === 'message') return result.message;
      const sign = (flag) => (flag ? '-' : '');
      if (result.form === 'fraction') {
        return result.label + '=' + sign(result.fraction.negative)
          + result.fraction.num + '/' + result.fraction.den;
      }
      if (result.form === 'surd') {
        return result.label + '=' + sign(result.surd.rationalNegative)
          + result.surd.rationalNum + '/' + result.surd.rationalDen
          + (result.surd.coeffNegative ? '-' : '+')
          + result.surd.coeffNum + '/' + result.surd.coeffDen + '√' + result.surd.radicand;
      }
      // Bậc 3/4 giải bằng SỐ nên có thêm hai dạng: thập phân và phức thập
      // phân. So bằng đúng CHUỖI ĐÃ ĐỊNH DẠNG — tức đúng thứ hiện trên màn
      // hình — chứ không so số thực, vì máy thật chỉ cho ta xem 10 chữ số.
      if (result.form === 'decimal') return result.label + '=' + result.text;
      if (result.form === 'complexDecimal') {
        const im = (result.imNegative ? '-' : '+') + (result.imIsOne ? '' : result.im) + 'i';
        return result.label + '=' + (result.reIsZero ? im.replace('+', '') : result.re + im);
      }
      if (result.form === 'message') return result.text;
      return result.label + '=' + sign(result.re.rationalNegative)
        + result.re.rationalNum + '/' + result.re.rationalDen
        + (result.im.coeffNegative ? '-' : '+')
        + result.im.coeffNum + '/' + result.im.coeffDen + '√' + result.im.radicand + 'i';
    }

    // Đọc liền N màn hình kế tiếp bằng cách bấm "=" — đúng cách máy đi qua
    // các nghiệm rồi tới các màn hình cực trị.
    function screenSequence(engine, count) {
      const out = [rootText(engine.getState())];
      for (let i = 1; i < count; i++) {
        engine.equals();
        out.push(rootText(engine.getState()));
      }
      return out.join(' | ');
    }

    // Hệ 2 ẩn nghiệm nguyên: x+y=3, x−y=1 → x=2, y=1
    e = solveEquationWith('simul2', [1, 1, 3, 1, -1, 1]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] hệ 2 ẩn x+y=3, x−y=1 → x=2', rootText(e.getState()), 'x=2/1');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...bấm = ra nghiệm thứ hai y=1', rootText(e.getState()), 'y=1/1');
    e.equals();
    check('[MANUAL tr.165] = ở nghiệm cuối quay lại Bộ soạn thảo hệ số',
      e.getState().result, null);

    // Hệ 2 ẩn nghiệm phân số: 2x+3y=1, x−y=1 → x=4/5, y=−1/5.
    // Ca này canh việc giải bằng phân số CHÍNH XÁC: nếu tính bằng số thực,
    // 4/5 sẽ ra 0.8 và mất dạng phân số.
    e = solveEquationWith('simul2', [2, 3, 1, 1, -1, 1]);
    check('[ĐÃ XÁC NHẬN 2026-08-18] hệ 2 ẩn nghiệm phân số → x=4/5', rootText(e.getState()), 'x=4/5');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-18] ...y=−1/5', rootText(e.getState()), 'y=-1/5');

    // Hệ 3 ẩn: x+y+z=6, x−y=0, z=3 → x=3/2, y=3/2, z=3
    e = solveEquationWith('simul3', [1, 1, 1, 6, 1, -1, 0, 0, 0, 0, 1, 3]);
    check('[ĐÃ XÁC NHẬN 2026-08-18] hệ 3 ẩn → x=3/2', rootText(e.getState()), 'x=3/2');
    e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-18] hệ 3 ẩn → nghiệm thứ ba z=3', rootText(e.getState()), 'z=3/1');

    // Hệ suy biến — chữ máy hiện đã đối chiếu 2026-08-17 (xem nhãn hai ca).
    e = solveEquationWith('simul2', [1, 1, 1, 1, 1, 2]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] hệ mâu thuẫn (x+y=1, x+y=2) → No Solution',
      rootText(e.getState()), 'No Solution');
    e = solveEquationWith('simul2', [1, 1, 1, 2, 2, 2]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] hệ thiếu ràng buộc (x+y=1, 2x+2y=2) → Infinite Solution',
      rootText(e.getState()), 'Infinite Solution');

    // Bậc 2 — bốn dạng nghiệm.
    // Màn hình nhập đa thức là CHÍNH đa thức: tiêu đề "ax²+bx+c" rồi
    // `▓▓x²+ 0x + 0`. Hệ số âm biến dấu thành TOÁN TỬ và ô hiện trị tuyệt đối
    // (`3x − 1`, không phải `3x + −1`) — ĐÃ XÁC NHẬN 2026-08-17.
    e = createEngine();
    e.setCalcMode('equation'); e.setEquationType('poly2');
    check('[ĐÃ XÁC NHẬN 2026-08-17] đa thức bậc 2: dòng tiêu đề ax²+bx+c',
      e.getState().header, 'ax²+bx+c');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...mẫu inline có 3 ô, dấu lấy từ ô 1 và 2',
      templateRow(e.getState(), 0), '{0}x²±1{1}x±2{2}');
    typeNumber(e, '2'); e.equals();
    typeNumber(e, '3'); e.equals();
    typeNumber(e, '-1'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] hệ số −1: ô hiện "1", dấu nằm ở toán tử',
      e.getState().cells[2].absText + '|' + e.getState().cells[2].negative, '1|true');

    e = solveEquationWith('poly2', [1, -3, 2]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²−3x+2=0 → x₁=2', rootText(e.getState()), 'x₁=2/1');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²−3x+2=0 → x₂=1', rootText(e.getState()), 'x₂=1/1');

    e = solveEquationWith('poly2', [1, 0, -2]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²−2=0 → x₁=√2 (x₂=−√2), dạng căn thức',
      rootText(e.getState()), 'x₁=0/1+1/1√2');

    e = solveEquationWith('poly2', [1, -2, 1]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²−2x+1=0 → nghiệm kép, nhãn "x" trần',
      rootText(e.getState()), 'x=1/1');
    // Một nghiệm, rồi hai màn hình cực trị → 3 màn hình trong chuỗi.
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...chỉ MỘT nghiệm, + 2 màn hình cực trị',
      e.getState().result.count, 3);

    // Ví dụ 4-1 của manual (trang 168) — nghiệm phức −1 ± √2 i.
    e = solveEquationWith('poly2', [1, 2, 3]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²+2x+3=0 → x₁=−1+√2 i',
      rootText(e.getState()), 'x₁=-1/1+1/1√2i');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²+2x+3=0 → x₂=−1−√2 i',
      rootText(e.getState()), 'x₂=-1/1-1/1√2i');

    // Màn hình cực trị sau nghiệm cuối — ĐÃ XÁC NHẬN 2026-08-17. Ba ca dưới
    // đây phân biệt được ba điều khác nhau: có màn hình cực trị hay không,
    // chữ Min/Max đổi theo dấu a, và cực trị vẫn hiện khi nghiệm là số phức.
    e = solveEquationWith('poly2', [2, 3, -1]);
    e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] 2x²+3x−1: sau x₂ là "Min of y", x=−3/4',
      e.getState().result.header + ' ' + rootText(e.getState()), 'Min of y=ax²+bx+c x=-3/4');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...rồi y=−17/8',
      rootText(e.getState()), 'y=-17/8');

    // a<0: chữ đổi thành Max, VÀ nghiệm lớn đứng trước (x₁=2 rồi x₂=0) —
    // chia cho 2a âm sẽ đảo thứ tự, đây là ca bắt được lỗi đó.
    e = solveEquationWith('poly2', [-1, 2, 0]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] −x²+2x=0 → x₁=2 (nghiệm lớn trước)',
      rootText(e.getState()), 'x₁=2/1');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...x₂=0', rootText(e.getState()), 'x₂=0/1');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...a<0 nên là "Max of y", x=1',
      e.getState().result.header + ' ' + rootText(e.getState()), 'Max of y=ax²+bx+c x=1/1');

    // Nghiệm phức vẫn có màn hình cực trị.
    e = solveEquationWith('poly2', [1, 2, 3]);
    e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²+2x+3 nghiệm phức vẫn ra "Min of y", x=−1',
      e.getState().result.header + ' ' + rootText(e.getState()), 'Min of y=ax²+bx+c x=-1/1');

    // Sau màn hình cực trị cuối, "=" về Bộ soạn thảo: hệ số còn nguyên và ô
    // ĐẦU TIÊN được chọn lại (không phải ô cuối vừa nhập) — ĐÃ XÁC NHẬN.
    e.equals(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-17] về Bộ soạn thảo: hệ số còn nguyên',
      e.getState().cells.map((c) => c.text).join(','), '1,2,3');
    check('[ĐÃ XÁC NHẬN 2026-08-17] ...và ô đầu tiên được chọn lại',
      e.getState().cells.findIndex((c) => c.selected), 0);

    // Phần ảo THUẦN HỮU TỈ — ca canh một lỗi thật đã bắt được lúc làm: căn
    // của |D| khi |D| chính phương nằm ở ô "rational" chứ không phải "coeff",
    // lấy nhầm ô sẽ ra phần ảo bằng 0.
    e = solveEquationWith('poly2', [1, 0, 1]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] x²+1=0 → phần ảo hữu tỉ 1 (máy VẼ ra "i", xem buildComplexRootNodes)',
      rootText(e.getState()), 'x₁=0/1+1/1√1i');
    e = solveEquationWith('poly2', [2, 2, 5]);
    check('[ĐÃ XÁC NHẬN 2026-08-17] 2x²+2x+5=0 → dữ liệu −1/2 và 3/2 (máy VẼ ra "(−1+3i)/2")',
      rootText(e.getState()), 'x₁=-1/2+3/2√1i');

    e = solveEquationWith('poly2', [0, 2, 3]);
    check('[ĐÃ XÁC NHẬN 2026-08-18] bậc 2 với a=0 → Math ERROR', e.getState().message, 'Math ERROR');
    // AC trên màn hình lỗi chỉ huỷ lỗi, y như ở Ratio — hệ số và ô đang chọn
    // giữ nguyên. ĐÃ XÁC NHẬN 2026-08-18: màn hình về lại "0x²+ 2x ▓" với ô c
    // vẫn tô ngược, đang giữ 3. Hai mode cùng đi qua một nhánh code nên phải
    // có ca ở CẢ HAI, không suy từ mode này sang mode kia.
    e.clear();
    check('[ĐÃ XÁC NHẬN 2026-08-18] AC huỷ lỗi ở Equation: hệ số còn nguyên',
      e.getState().cells.map((c) => c.text).join(','), '0,2,3');
    check('[ĐÃ XÁC NHẬN 2026-08-18] ...và vẫn đứng ở ô c',
      e.getState().cells.findIndex((c) => c.selected), 2);

    // ===== Đa thức bậc 3 và bậc 4 =====
    // Mọi kỳ vọng dưới đây tự bấm trên bản giả lập chính hãng 2026-08-23.
    // Điểm khác bậc 2 phải nhớ: bậc 3/4 giải bằng SỐ, không phải đại số.

    // Ca PHÂN BIỆT quan trọng nhất của cả mục: x³−x²−2x+2 = (x−1)(x²−2) nên
    // nghiệm đúng bằng ±√2, thế mà máy vẫn cho thập phân. Nếu ta giải đại số
    // như bậc 2 thì ca này sẽ ra dạng căn và lệch máy ngay.

    // Các ca dưới đây gọi thẳng hàm dựng node của ui.js rồi đọc lại cây DOM
    // sinh ra, nên chặn đúng loại lỗi đó.
    //
    // Quy ước đọc: phân số ghi "(tử)/(mẫu)", dấu căn ghi "√(...)", con trỏ và
    // ô trống bỏ qua. Chỉ đọc CẤU TRÚC node — không kiểm CSS, cỡ chữ hay bố
    // cục, những thứ đó vẫn phải nhìn bằng mắt.
    function nodeToText(el) {
      if (el.nodeType === 3) return el.textContent;
      const cls = typeof el.className === 'string' ? el.className : (el.getAttribute('class') || '');
      if (cls.indexOf('cursor') !== -1 || cls.indexOf('slot-empty') !== -1) return '';
      const inner = Array.prototype.map.call(el.childNodes, nodeToText).join('');
      if (cls === 'frac-num') return '(' + inner + ')/';
      if (cls === 'frac-den') return '(' + inner + ')';
      if (cls === 'radical') return '√(' + inner + ')';
      return inner;
    }

    // tử. ĐÃ XÁC NHẬN 2026-08-18 — hệ 2x+3y=1, x−y=1 cho y hiện dấu "−" rồi
    // mới tới 1/5 xếp tầng. Ca này canh đúng loại lỗi đã lọt hai lần trước
    // (dữ liệu đúng, chỗ vẽ sai): rootText chỉ đọc dữ liệu nên không bắt được.
    e = solveEquationWith('simul2', [2, 3, 1, 1, -1, 1]);
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-18] y=−1/5 VẼ dấu trừ ngoài phân số',
      rootDisplay(e), '−(1)/(5)');

    // ===== Bàn phím (Tầng 6) — bảng gán phím =====
    // Vì sao có mục này: tới 2026-08-18 bàn phím vẫn viết tay trong index.html
    // mà KHÔNG test nào đọc tới, nên ba lỗi gán phím sống sót rất lâu — log
    // gán nhầm phím, thiếu hẳn biến M, màn hình sau STO vẽ sai. Nay bàn phím
    // sinh ra từ keypad.js và mục này canh chính bảng đó, nên sai lệch gán
    // phím bị bắt ngay chứ không đợi có người bấm trúng.

    // Bố cục vật lý được đối chiếu trực tiếp với ClassPad 2026-10-01.
    // Bảng độc lập này chặn việc thiết kế lại làm đảo vị trí một phím.
    const physicalRows = [
      'SHIFT|ALPHA|▲◀▶▼|MENU|ON|OPTN|CALC|∫dx|x',
      '□/□|√|x²|^|log▫|ln',
      '(-)|°′″|x⁻¹|sin|cos|tan',
      'STO|ENG|(|)|S⇔D|M+',
      '7|8|9|DEL|AC', '4|5|6|×|÷', '1|2|3|+|−', '0|.|×10ˣ|Ans|='
    ];
    physicalRows.forEach((expected, row) => {
      check('[ĐÃ XÁC NHẬN 2026-10-01] vị trí phím hàng ' + (row + 1),
        KEYPAD_ROWS[row].keys.map(key => key.dpad ?
          key.dpad.filter(part => !part.center).map(part => part.label).join('') : key.label).join('|'), expected);
    });

    // Các tên này ui.js xử lý thẳng trong handler, không nằm trong ACTIONS.
    const HANDLER_ACTIONS = ['shift', 'menu', 'setup', 'recall', 'simulator-off'];
    const actionExists = (name) => !!ACTIONS[name] || HANDLER_ACTIONS.indexOf(name) !== -1;

    // Gõ sai tên hành động là loại lỗi trình duyệt NUỐT IM LẶNG: bấm phím
    // không ra gì, không báo lỗi gì. Ca này bắt đúng loại đó.
    const badActions = [];
    keypadAllKeys().forEach((k) => {
      if (k.action && !actionExists(k.action)) badActions.push(k.label + '→' + k.action);
      if (k.shift && !actionExists(k.shift)) badActions.push(k.label + '→SHIFT:' + k.shift);
      if (k.alphaAction && !ALPHA_ACTIONS[k.alphaAction]) badActions.push(k.label + '→ALPHA:' + k.alphaAction);
    });
    check('mọi hành động của phím đều có thật trong ui.js', badActions.join(' | '), '');

    // Bảng gán đã đối chiếu bản giả lập. Mỗi phím rút thành "action|shift|biến",
    // dấu "-" là không gán.
    const keyMap = {};
    keypadAllKeys().forEach((k) => {
      keyMap[k.label] = [k.action || '-', k.shift || '-', k.alphaVar || '-'].join('|');
    });
    const checkKey = (label, expected, note) =>
      check('[bàn phím] ' + label + (note ? ' — ' + note : ''), keyMap[label], expected);

    checkKey('ON', 'on|-|-',
      'ĐÃ XÁC NHẬN 2026-09-30: khởi động lại màn hình, giữ Ans/biến/SETUP');
    checkKey('ENG', 'eng|eng-back|-',
      'ĐÃ XÁC NHẬN 2026-08-23: SHIFT+ENG là chiều ngược, nhãn ←');
    checkKey('log▫', 'logn|pow10|-',
      'ĐÃ XÁC NHẬN 2026-08-18/28: log trần mở mẫu log▫(▫) hai ô; SHIFT+log = 10ˣ');
    checkKey('(-)', 'negative|log|A',
      'ĐÃ XÁC NHẬN 2026-08-18: log cơ số 10 nằm ở SHIFT+(−), không phải phím log');
    checkKey('°′″', 'dms|prime-factorization|B',
      'ĐÃ XÁC NHẬN 2026-09-30: phím trần nhập/chuyển đổi độ-phút-giây');
    checkKey('M+', 'memory-add|memory-subtract|M',
      'ĐÃ XÁC NHẬN 2026-08-18: ALPHA+M+ = biến M');
    checkKey('ln', 'ln|exp|-',
      'ĐÃ XÁC NHẬN 2026-08-18: ln phẳng, KHÔNG có ô cơ số như log');
    checkKey('√', 'sqrt|cbrt|-', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('x²', 'square|cube|-', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('^', 'power|nthroot|-', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('□/□', 'fraction|mixed-number|-', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('x⁻¹', 'reciprocal|factorial|C', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('sin', 'sin|asin|D', 'ĐÃ XÁC NHẬN 2026-08-18');
    checkKey('STO', 'sto|recall|-', 'ĐÃ XÁC NHẬN 2026-08-18: SHIFT+STO mở RECALL');
    checkKey('×10ˣ', 'times10|pi|-',
      'ĐÃ XÁC NHẬN 2026-09-30: phím trần nhập ×10 mũ, SHIFT vẫn ra π');
    checkKey('x', 'input-x|sum|-', 'ĐÃ XÁC NHẬN 2026-08-14: Σ ở SHIFT+x');
    const productKey = keypadAllKeys().find((k) => k.label === 'x');
    check('[bàn phím] x — ĐÃ XÁC NHẬN 2026-09-15: Π ở ALPHA+x',
      [productKey.alphaAction, productKey.alphaLabel].join('|'), 'product|Π');
    checkKey('0', '-|round|-', 'ĐÃ XÁC NHẬN 2026-10-05: SHIFT+0 nối Rnd');
    checkKey('Ans', 'ans|percent|-',
      'ĐÃ XÁC NHẬN 2026-10-03: SHIFT+Ans = %, ALPHA+Ans = PreAns');
    check('[ĐÃ XÁC NHẬN 2026-10-03] ALPHA+Ans nối PreAns',
      keypadAllKeys().find(key => key.label === 'Ans').alphaAction, 'preans');
    checkKey('=', 'equals|approx|-');
    check('[ĐÃ XÁC NHẬN 2026-10-03] SHIFT+× nối nPr',
      keypadAllKeys().find(key => key.label === '×').shift, 'permutation');
    check('[ĐÃ XÁC NHẬN 2026-10-03] SHIFT+÷ nối nCr',
      keypadAllKeys().find(key => key.label === '÷').shift, 'combination');
    check('[ĐÃ XÁC NHẬN 2026-10-03] ALPHA+× nối GCD',
      keypadAllKeys().find(key => key.label === '×').alphaAction, 'gcd');
    check('[ĐÃ XÁC NHẬN 2026-10-03] ALPHA+÷ nối LCM',
      keypadAllKeys().find(key => key.label === '÷').alphaAction, 'lcm');

    // ===== ON khi máy đang bật =====
    e = createEngine();
    e.inputDigit('1'); e.inputOperator('+'); e.inputDigit('1'); e.equals();
    e.inputDigit('2'); e.inputOperator('+'); e.inputDigit('2'); e.equals();
    e.setAngleUnit('rad');
    e.inputDigit('5'); e.inputSto(); e.inputVariable('A');
    e.powerOn();
    check('[ĐÃ XÁC NHẬN 2026-09-30] ON xóa màn hình hiện hành',
      e.getState().mode + ':' + e.getDisplay(), 'input:');
    check('[ĐÃ XÁC NHẬN 2026-09-30] ON xóa toàn bộ lịch sử',
      String(e.getState().scrollUp), 'false');
    e.moveCursor('up');
    check('[ĐÃ XÁC NHẬN 2026-09-30] ▲ sau ON không gọi lại được lịch sử',
      e.getState().mode + ':' + e.getDisplay(), 'input:');
    check('[ĐÃ XÁC NHẬN 2026-09-30] ON giữ SETUP Angle Unit', e.getAngleUnit(), 'rad');
    e.inputAlpha(); e.inputVariable('A'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] ON giữ biến A', e.getState().result, '5');
    e.powerOn(); e.inputAns(); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] ON giữ Ans', e.getState().result, '5');

    // ===== Phím ×10ˣ nhập ký pháp khoa học =====
    e = createEngine();
    e.inputTimesTenPower();
    check('[ĐÃ XÁC NHẬN 2026-09-30] ×10ˣ ở màn hình trống chèn cả cụm',
      e.getDisplay(), '×10^()');
    e.deleteLast();
    check('[ĐÃ XÁC NHẬN 2026-09-30] DEL khi mũ rỗng gỡ nguyên cụm ×10ˣ',
      e.getDisplay(), '');

    e = createEngine();
    e.inputDigit('2'); e.inputTimesTenPower(); e.inputDigit('3'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] 2 ×10ˣ 3 = 2000', e.getState().result, '2000');

    e = createEngine();
    e.inputDigit('2'); e.inputTimesTenPower(); e.inputNegative(); e.inputDigit('3'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] 2 ×10ˣ (−)3 có giá trị 2×10⁻³ ở Norm 1',
      e.getState().result, '2×10⁻³');
    check('[ĐÃ XÁC NHẬN 2026-09-30] 2 ×10ˣ (−)3 giữ phân số 1/500',
      [e.getState().exactFraction.num, e.getState().exactFraction.den].join('/'), '1/500');

    e = createEngine();
    e.inputDigit('2'); e.inputTimesTenPower(); e.inputDigit('3');
    e.inputOperator('+'); e.inputDigit('1'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] toán tử tự thoát vùng mũ của ×10ˣ',
      renderNodes(e.getState().expressionNodes, null, -1).textContent + '=' + e.getState().result,
      '2×103+1=2001');

    // ===== Độ-phút-giây (DMS) =====
    const inputDms = (engine, degrees, minutes, seconds) => {
      String(degrees).split('').forEach(ch => ch === '.' ? engine.inputDot() : engine.inputDigit(ch));
      engine.inputDms();
      String(minutes).split('').forEach(ch => ch === '.' ? engine.inputDot() : engine.inputDigit(ch));
      engine.inputDms();
      if (seconds !== undefined) {
        String(seconds).split('').forEach(ch => ch === '.' ? engine.inputDot() : engine.inputDigit(ch));
        engine.inputDms();
      }
    };

    e = createEngine();
    inputDms(e, 2, 0, 30);
    check('[ĐÃ XÁC NHẬN 2026-09-30] nhập đủ ba phần DMS', e.getDisplay(), '2°0′30″');
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] 2°0′30″ giữ dạng DMS sau =', e.getState().dmsResult, '2°0′30″');
    check('[ĐÃ XÁC NHẬN 2026-09-30] giá trị thập phân của 2°0′30″', e.getState().result, '2.008333333');
    e.inputDms();
    check('[ĐÃ XÁC NHẬN 2026-09-30] °′″ trên kết quả đổi DMS sang thập phân',
      e.getState().dmsResult === undefined ? e.getState().result : e.getState().dmsResult, '2.008333333');
    e.inputDms();
    check('[ĐÃ XÁC NHẬN 2026-09-30] °′″ lần nữa trả về DMS', e.getState().dmsResult, '2°0′30″');

    e = createEngine();
    inputDms(e, 2, 30);
    e.equals();
    check('[ĐÃ XÁC NHẬN 2026-09-30] bỏ giây tự hoàn thiện 0″', e.getState().dmsResult, '2°30′0″');

    e = createEngine();
    inputDms(e, 2, 20, 30);
    e.inputOperator('+');
    inputDms(e, 0, 39, 30);
    e.equals();
    check('[MANUAL CASIO DMS] 2°20′30″ + 0°39′30″ = 3°0′0″', e.getState().dmsResult, '3°0′0″');

    e = createEngine();
    e.inputDigit('2'); e.inputDot(); e.inputDigit('2'); e.inputDigit('5'); e.inputDigit('5');
    e.approxEquals(); e.inputDms();
    check('[ĐÃ XÁC NHẬN 2026-09-30] đổi 2.255 sang DMS', e.getState().dmsResult, '2°15′18″');

    // Đủ mười biến, mỗi biến đúng một phím — ca này bắt cả việc THIẾU (như M
    // trước 2026-08-18) lẫn việc gán trùng hai phím cùng một biến.
    const alphaVars = keypadAllKeys().map((k) => k.alphaVar).filter(Boolean).sort();
    check('[ĐÃ XÁC NHẬN 2026-09-17] mười biến A-F, M, x, y, z, mỗi biến đúng một phím', alphaVars.join(''), 'ABCDEFMxyz');

    // Phím khoá mà vẫn có hành động trần thì khoá làm gì.
    const lockedWithAction = keypadAllKeys()
      .filter((k) => k.locked && k.action).map((k) => k.label);
    check('phím khoá không có hành động trần', lockedWithAction.join(','), '');

    // ===== SETUP → Number Format (Fix / Sci / Norm) =====
    // TOÀN BỘ số liệu dưới đây tự bấm trên bản giả lập chính hãng ngày
    // 2026-08-21, SAU khi "Initialize All" nên là trạng thái gốc của máy chứ
    // không phải trạng thái phiên web. Cách đọc: mỗi ca ghi đúng chuỗi phím
    // đã bấm và đúng chuỗi ĐỌC ĐƯỢC trên màn hình LCD.
    //
    // Các ca được chọn để PHÂN BIỆT ĐƯỢC hai cách hiểu, theo Quy tắc test:
    // vd 1÷191 phân biệt Norm 1 với Norm 2 (một bên ra dạng mũ, một bên ra
    // 0.005235602094), còn 2÷3 ở Fix 3 phân biệt làm tròn với cắt bỏ
    // (0.667 so với 0.666). Ca như 1+1 thì không chứng minh được gì.

    // -- Mặc định: Norm 1 --
    e = createEngine();
    check('[ĐÃ XÁC NHẬN 2026-08-21] mặc định là Norm 1',
      JSON.stringify(e.getNumberFormat()), JSON.stringify({ kind: 'norm', digits: 1 }));

    // Chính là ca đã bấm để xác định mặc định. 1÷191 ở MathI/MathO ra phân số,
    // S⇔D mới ra thập phân — engine ta cũng vậy, nên lấy thẳng dòng thập phân.
    e = createEngine();
    e.inputDigit('1'); e.inputOperator('÷');
    e.inputDigit('1'); e.inputDigit('9'); e.inputDigit('1'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-21] 1÷191 ở Norm 1 (dòng thập phân)',
      e.getState().result, '5.235602094×10⁻³');

    // -- Norm 1: hai biên --
    function normCase(label, keys, format, expected) {
      const en = createEngine();
      if (format) en.setNumberFormat(format);
      keys(en);
      en.equals();
      check(label, en.getState().result, expected);
    }

    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 1: 1÷100 → 0.01 (biên dưới 10⁻² chưa vượt)',
      (en) => { en.inputDigit('1'); en.inputOperator('÷'); en.inputDigit('1'); en.inputDigit('0'); en.inputDigit('0'); },
      null, '0.01');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 1: 1÷1000 → 1×10⁻³ (đã vượt biên dưới)',
      (en) => { en.inputDigit('1'); en.inputOperator('÷'); en.inputDigit('1'); en.inputDigit('0'); en.inputDigit('0'); en.inputDigit('0'); },
      null, '1×10⁻³');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 1: 10⁹ → 1000000000 (biên trên chưa vượt)',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputDigit('9'); },
      null, '1000000000');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 1: 10¹⁰ → 1×10¹⁰ (đã vượt biên trên)',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputDigit('1'); en.inputDigit('0'); },
      null, '1×10¹⁰');

    // -- Norm 2: chỉ khác biên DƯỚI, biên trên vẫn 10¹⁰ --
    const NORM2 = { kind: 'norm', digits: 2 };
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 2: 10⁻⁹ → 0.000000001 (Norm 1 đã cho dạng mũ)',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputNegative(); en.inputDigit('9'); },
      NORM2, '0.000000001');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 2: 10⁻¹⁰ → 1×10⁻¹⁰ (đã vượt biên dưới)',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputNegative(); en.inputDigit('1'); en.inputDigit('0'); },
      NORM2, '1×10⁻¹⁰');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Norm 2: 10¹⁰ → 1×10¹⁰ (biên trên dùng chung với Norm 1)',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputDigit('1'); en.inputDigit('0'); },
      NORM2, '1×10¹⁰');

    // -- Fix --
    const FIX3 = { kind: 'fix', digits: 3 };
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Fix 3: 2÷3 → 0.667, tức LÀM TRÒN chứ không cắt (cắt sẽ ra 0.666)',
      (en) => { en.inputDigit('2'); en.inputOperator('÷'); en.inputDigit('3'); },
      FIX3, '0.667');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Fix 3: 1÷10000 → 0.000, Fix ĐÈ biên dưới (Norm 1 sẽ cho 1×10⁻⁴)',
      (en) => { en.inputDigit('1'); en.inputOperator('÷'); en.inputDigit('1'); en.inputDigit('0'); en.inputDigit('0'); en.inputDigit('0'); en.inputDigit('0'); },
      FIX3, '0.000');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Fix 3: 0 → 0.000',
      (en) => { en.inputDigit('0'); },
      FIX3, '0.000');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Fix 0: 2÷3 → "1.", giữ lại dấu chấm cuối',
      (en) => { en.inputDigit('2'); en.inputOperator('÷'); en.inputDigit('3'); },
      { kind: 'fix', digits: 0 }, '1.');
    // Ca quan trọng nhất của Fix: vượt biên TRÊN thì Fix NHẢ RA, quay về dạng
    // mũ 10 chữ số của Norm. Nếu Fix áp cả vào phần định trị thì đã ra
    // "3.333×10¹⁰" — nên ca này phân biệt được hai cách hiểu.
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Fix 3: 10¹¹÷3 → 3.333333333×10¹⁰, Fix KHÔNG áp vào phần định trị',
      (en) => { en.inputDigit('1'); en.inputDigit('0'); en.inputPower(); en.inputDigit('1'); en.inputDigit('1'); en.moveCursor('right'); en.inputOperator('÷'); en.inputDigit('3'); },
      FIX3, '3.333333333×10¹⁰');

    // -- Sci: n CHỮ SỐ CÓ NGHĨA, luôn dạng mũ --
    const SCI5 = { kind: 'sci', digits: 5 };
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Sci 5: 1÷3 → 3.3333×10⁻¹ (5 chữ số có nghĩa)',
      (en) => { en.inputDigit('1'); en.inputOperator('÷'); en.inputDigit('3'); },
      SCI5, '3.3333×10⁻¹');
    // Số mũ bằng 0 VẪN hiện — ca này phân biệt "luôn dạng mũ" với "chỉ dùng
    // dạng mũ khi vượt biên".
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Sci 5: 1.3 → 1.3000×10⁰, số mũ 0 vẫn hiện và có đệm số 0',
      (en) => { en.inputDigit('1'); en.inputDot(); en.inputDigit('3'); },
      SCI5, '1.3000×10⁰');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Sci 5: 0 → 0.0000×10⁰',
      (en) => { en.inputDigit('0'); },
      SCI5, '0.0000×10⁰');
    normCase('[ĐÃ XÁC NHẬN 2026-08-21] Sci 0 nghĩa là 10 chữ số: 1÷3 → 3.333333333×10⁻¹',
      (en) => { en.inputDigit('1'); en.inputOperator('÷'); en.inputDigit('3'); },
      { kind: 'sci', digits: 0 }, '3.333333333×10⁻¹');

    // -- Fix/Sci chỉ là chuyện HIỂN THỊ --
    // Ở Fix 0, 2÷3 hiện "1." nhưng Ans vẫn giữ 0.666... nên Ans×3 ra "2."
    // chứ không phải "3.". Ca này phân biệt "làm tròn để hiện" với "làm tròn
    // rồi ghi đè giá trị".
    e = createEngine();
    e.setNumberFormat({ kind: 'fix', digits: 0 });
    e.inputDigit('2'); e.inputOperator('÷'); e.inputDigit('3'); e.equals();
    check('[ĐÃ XÁC NHẬN 2026-08-21] Fix 0: 2÷3 hiện "1."', e.getState().result, '1.');

    // Gom các dòng đang hiện trên màn hình, theo đúng thứ tự vẽ.
    function screenLines() {
      const out = [];
      (function walk(node) {
        const cls = String(node.className || '');
        if (cls.indexOf('screen-line') === 0) { out.push(node.textContent); return; }
        (node.childNodes || []).forEach(walk);
      })(document.getElementById('screen'));
      return out;
    }

    // Đếm riêng dòng mẫu hệ số — thứ KHÔNG được xuất hiện ở màn hình nghiệm.
    function templateLineCount() {
      let n = 0;
      (function walk(node) {
        if (String(node.className || '').indexOf('coef-template') >= 0) n++;
        (node.childNodes || []).forEach(walk);
      })(document.getElementById('screen'));
      return n;
    }

      for (let i = 0; i < (extraEquals || 0); i++) en.equals();
      renderCoefficientEditor(en.getState());
      return en;
    }

    // Gõ một dãy ký tự, trong đó ký tự đứng sau dấu "@" là ký hiệu kỹ thuật.
    function typeWithSymbols(en, text) {
      let i = 0;
      while (i < text.length) {
        const ch = text[i];
        if (ch === '@') { en.inputEngineerSymbol(text[i + 1]); i += 2; continue; }
        if (/[0-9]/.test(ch)) en.inputDigit(ch);
        else if (ch === '(') en.inputOpenParen();
        else if (ch === ')') en.inputCloseParen();
        else if (ch === '²') en.inputOperator('²');
        else if (ch === 'π') en.inputPi();
        else en.inputOperator(ch);
        i++;
      }
      return en;
    }

    function poly2(en, coefficients) {
      en.setCalcMode('equation');
      en.setEquationType('poly2');
      coefficients.forEach((c) => {
        if (c < 0) { en.inputNegative(); }
        String(Math.abs(c)).split('').forEach((d) => en.inputDigit(d));
        en.equals();
      });
      en.equals();
      return en;
    }
